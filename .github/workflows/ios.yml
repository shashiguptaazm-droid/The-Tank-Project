name: iOS Build & Test

on:
  push:
    # Any branch: this project also lives on a side branch of a shared repo, so a
    # trimmed branch filter would silently skip the build.
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 45

    env:
      SCHEME: MediGyaan
      PROJECT: MediGyaan.xcodeproj
      DESTINATION: "platform=iOS Simulator,name=iPhone 16,OS=latest"

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators
        run: xcrun simctl list devices available | head -40

      # xcodebuild writes its diagnostics to an authenticated log stream. To
      # keep the actual compiler errors readable without repo credentials, the
      # errors are parsed out and republished as check-run annotations, which
      # anyone with read access to the repository can fetch.
      - name: Build
        run: |
          set +e
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1
          STATUS=$?
          echo "xcodebuild exited: $STATUS"

          python3 - <<'PARSE' || true
          import re, pathlib
          log = pathlib.Path('build.log').read_text(errors='replace').splitlines()
          pat = re.compile(r'\berror:\s')
          seen, uniq = set(), []
          for line in log:
              text = line.strip()
              if pat.search(text) and text not in seen:
                  seen.add(text)
                  uniq.append(text)
          print(f'TOTAL_UNIQUE_ERRORS={len(uniq)}')
          if not uniq:
              print('::error::Build failed but no "error:" lines were found; see the tail below.')
              for line in log[-40:]:
                  print(line)
          # Annotations are capped per step, so batch them to lose as little as possible.
          BATCH = 12
          for i in range(0, min(len(uniq), 120), BATCH):
              chunk = uniq[i:i + BATCH]
              msg = ' | '.join(c[:200] for c in chunk)
              msg = msg.replace('%', '%25').replace('\n', ' ').replace('\r', ' ')
              print(f'::error::errors {i + 1}-{i + len(chunk)} of {len(uniq)}: {msg}')
          PARSE

          echo '--- last 60 lines of build.log ---'
          tail -60 build.log

          if [ "$STATUS" -ne 0 ]; then
            echo 'Build failed.'
            exit 1
          fi

      - name: Test
        run: |
          set +e
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            > test.log 2>&1
          STATUS=$?
          echo "xcodebuild test exited: $STATUS"

          # XCTest failures do not always appear as "error:" lines, so both the
          # assertion and result lines are republished as annotations.
          python3 - <<'PARSE' || true
          import re, pathlib
          log = pathlib.Path('test.log').read_text(errors='replace').splitlines()
          pat = re.compile(r'\berror:\s|Test Case .* (failed|passed)|XCTAssert.*failed|XCTSkip')
          seen, uniq = set(), []
          for line in log:
              text = line.strip()
              if pat.search(text) and text not in seen:
                  seen.add(text)
                  uniq.append(text)
          fails = [u for u in uniq if 'error:' in u or 'failed' in u or 'XCTSkip' in u]
          print(f'TOTAL_TEST_SIGNALS={len(uniq)} FAILURES={len(fails)}')
          BATCH = 12
          for i in range(0, min(len(fails), 120), BATCH):
              chunk = fails[i:i + BATCH]
              msg = ' | '.join(c[:220] for c in chunk)
              msg = msg.replace('%', '%25').replace('\n', ' ').replace('\r', ' ')
              print(f'::error::tests {i + 1}-{i + len(chunk)} of {len(fails)}: {msg}')
          PARSE

          echo '--- last 80 lines of test.log ---'
          tail -80 test.log

          if [ "$STATUS" -ne 0 ]; then
            echo 'Tests failed.'
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
