name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -20

      - name: Resolve SPM dependencies
        run: xcodebuild -resolvePackageDependencies -project FitWorld.xcodeproj -scheme FitWorld

      - name: Build & test (iPhone simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project FitWorld.xcodeproj \
            -scheme FitWorld \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            | xcbeautify --renderer github-actions
