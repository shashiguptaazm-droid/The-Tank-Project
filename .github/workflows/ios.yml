name: iOS Build & Test

on:
  push:
    # Any branch: this project also lives on a side branch of a shared repo, so a
    # trimmed branch filter would silently skip the build.
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write

    env:
      SCHEME: MediGyaan
      PROJECT: MediGyaan.xcodeproj
      DESTINATION: "platform=iOS Simulator,name=iPhone 16,OS=latest"

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators
        run: xcrun simctl list devices available | head -40

      # xcodebuild writes its diagnostics to an authenticated log stream. To
      # keep the actual compiler errors readable without repo credentials, the
      # errors are parsed out and republished as check-run annotations, which
      # anyone with read access to the repository can fetch.
      - name: Build
        run: |
          set +e
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1
          STATUS=$?
          echo "xcodebuild exited: $STATUS"
          export BUILD_STATUS=$STATUS

          python3 - <<'PARSE' || true
          import os, re, pathlib
          log = pathlib.Path('build.log').read_text(errors='replace').splitlines()
          pat = re.compile(r'\berror:\s')
          seen, uniq = set(), []
          for line in log:
              text = line.strip()
              if pat.search(text) and text not in seen:
                  seen.add(text)
                  uniq.append(text)
          print(f'TOTAL_UNIQUE_ERRORS={len(uniq)}')
          # Only a genuine failure should raise an annotation; a clean build also
          # has no "error:" lines.
          if not uniq and os.environ.get('BUILD_STATUS', '0') != '0':
              print('::error::Build failed but no "error:" lines were found; see the tail below.')
              for line in log[-40:]:
                  print(line)
          # Annotations are capped per step, so batch them to lose as little as possible.
          BATCH = 12
          for i in range(0, min(len(uniq), 120), BATCH):
              chunk = uniq[i:i + BATCH]
              msg = ' | '.join(c[:400] for c in chunk)
              msg = msg.replace('%', '%25').replace('\n', ' ').replace('\r', ' ')
              print(f'::error::errors {i + 1}-{i + len(chunk)} of {len(uniq)}: {msg}')
          PARSE

          echo '--- last 60 lines of build.log ---'
          tail -60 build.log

          if [ "$STATUS" -ne 0 ]; then
            echo 'Build failed.'
            exit 1
          fi

      - name: Archive & Package IPA (iOS Device arm64)
        run: |
          echo "=== Archiving MediGyaan for iOS Device ==="
          mkdir -p build
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath "build/MediGyaan.xcarchive" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            > archive.log 2>&1
          ARCHIVE_STATUS=$?
          echo "xcodebuild archive exited: $ARCHIVE_STATUS"
          if [ $ARCHIVE_STATUS -ne 0 ]; then
            echo "--- last 60 lines of archive.log ---"
            tail -60 archive.log
            exit $ARCHIVE_STATUS
          fi

          echo "=== Packaging MediGyaan.ipa ==="
          mkdir -p build/Payload
          cp -r "build/MediGyaan.xcarchive/Products/Applications/MediGyaan.app" build/Payload/

          if command -v codesign &>/dev/null; then
            echo "Applying ad-hoc signature to payload..."
            codesign --force --deep --sign - "build/Payload/MediGyaan.app" 2>/dev/null || true
          fi

          cd build
          zip -r -y MediGyaan.ipa Payload
          ls -lh MediGyaan.ipa
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediGyaan-v4.0-Release-IPA
          path: build/MediGyaan.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/ios-swiftui' || github.ref == 'refs/heads/main'
        with:
          tag_name: v4.0-latest
          name: MediGyaan v4.0 iOS Release
          body: "MediGyaan iOS v4.0 release package with complete 3D warrior suite, medical equipment, and asset bundle."
          files: build/MediGyaan.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Test
        continue-on-error: true
        run: |
          set +e
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            > test.log 2>&1
          STATUS=$?
          echo "xcodebuild test exited: $STATUS"

          python3 - <<'PARSE' || true
          import re, pathlib
          log = pathlib.Path('test.log').read_text(errors='replace').splitlines()
          pat = re.compile(r'\berror:\s|Test Case .* (failed|passed)|XCTAssert.*failed|XCTSkip')
          seen, uniq = set(), []
          for line in log:
              text = line.strip()
              if pat.search(text) and text not in seen:
                  seen.add(text)
                  uniq.append(text)
          fails = [u for u in uniq if 'error:' in u or 'failed' in u or 'XCTSkip' in u]
          print(f'TOTAL_TEST_SIGNALS={len(uniq)} FAILURES={len(fails)}')
          for i, line in enumerate(fails[:50]):
              msg = line[:4000]
              msg = msg.replace('%', '%25').replace('\n', ' ').replace('\r', ' ')
              print(f'::error::test {i + 1} of {len(fails)}: {msg}')
          PARSE

          echo '--- last 80 lines of test.log ---'
          tail -80 test.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
