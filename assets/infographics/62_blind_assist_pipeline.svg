<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34D399"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22D3EE"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#A78BFA"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FB923C"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F87171"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="750" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" fill="url(#accent)">🦯 BLIND-ASSISTANCE — AI Pipeline &amp; Data Flow</text>
  <text x="450" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748B">SENSE → ROUTE → ANALYZE → RETURN → FEEDBACK · End-to-end latency ~800ms</text>

  <!-- ===== STAGE 1: SENSE ===== -->
  <rect x="30" y="80" width="190" height="120" rx="14" fill="#1E293B" stroke="#FB923C" stroke-width="2.5" filter="url(#glow)"/>
  <text x="125" y="112" text-anchor="middle" font-size="28">📷</text>
  <text x="125" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#FB923C">SENSE</text>
  <text x="125" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#CBD5E1">ESP32-S3 CAM</text>
  <text x="125" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">640×480 JPEG @ 8.9fps</text>
  <text x="125" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">Night Vision · Chest-mounted</text>

  <!-- Arrow 1→2 -->
  <line x1="220" y1="140" x2="290" y2="140" stroke="#FB923C" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="255" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FB923C">WiFi</text>
  <text x="255" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#64748B">~5ms</text>

  <!-- ===== STAGE 2: ROUTE ===== -->
  <rect x="295" y="80" width="190" height="120" rx="14" fill="#1E293B" stroke="#00979D" stroke-width="2.5" filter="url(#glow)"/>
  <text x="390" y="112" text-anchor="middle" font-size="28">⚡</text>
  <text x="390" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#00979D">ROUTE</text>
  <text x="390" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#CBD5E1">Arduino UNO Q</text>
  <text x="390" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">QRB2210 + STM32U585</text>
  <text x="390" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">Belt-mounted · USB-C hub</text>

  <!-- Connectivity choice labels -->
  <rect x="295" y="210" width="190" height="30" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="390" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">WiFi → 4G LTE → Hotspot → Tailscale</text>

  <!-- Arrow 2→3 -->
  <line x1="485" y1="140" x2="555" y2="140" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="520" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#22D3EE">Tailscale</text>
  <text x="520" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#64748B">~30ms</text>

  <!-- ===== STAGE 3: ANALYZE (Jetson) ===== -->
  <rect x="560" y="80" width="190" height="120" rx="14" fill="#1E293B" stroke="#76B900" stroke-width="2.5" filter="url(#glow)"/>
  <text x="655" y="112" text-anchor="middle" font-size="28">🧠</text>
  <text x="655" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#76B900">ANALYZE</text>
  <text x="655" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#CBD5E1">Jetson Orin Nano</text>
  <text x="655" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">67 TOPS · CUDA GPU</text>
  <text x="655" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">YOLOv8n + Phi-3 + OCR</text>

  <!-- AI models in Jetson -->
  <rect x="560" y="210" width="190" height="30" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="655" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#76B900">YOLO 30ms</text>
  <text x="655" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#64748B">Phi-3 500ms · Whisper 200ms · OCR 200ms</text>

  <!-- Arrow 3→4 -->
  <line x1="655" y1="245" x2="655" y2="315" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="670" y="280" font-family="Arial,sans-serif" font-size="8" fill="#A78BFA">Tailscale</text>
  <text x="670" y="293" font-family="Arial,sans-serif" font-size="8" fill="#64748B">~30ms</text>

  <!-- ===== STAGE 4: RETURN (to UNO Q) ===== -->
  <rect x="560" y="320" width="190" height="100" rx="14" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/>
  <text x="655" y="352" text-anchor="middle" font-size="24">📨</text>
  <text x="655" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#A78BFA">RETURN</text>
  <text x="655" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#CBD5E1">Structured analysis</text>
  <text x="655" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">Objects · People · Text · Guidance</text>

  <!-- Arrow 4→5 -->
  <line x1="560" y1="370" x2="490" y2="370" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="525" y="362" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#A78BFA">Tailscale</text>
  <text x="525" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#64748B">~30ms</text>

  <!-- ===== STAGE 5: FEEDBACK ===== -->
  <rect x="295" y="320" width="190" height="100" rx="14" fill="#1E293B" stroke="#34D399" stroke-width="2.5" filter="url(#glow)"/>
  <text x="390" y="352" text-anchor="middle" font-size="28">🗣️</text>
  <text x="390" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#34D399">FEEDBACK</text>
  <text x="390" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#CBD5E1">Audio + Visual</text>
  <text x="390" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">Speaker · Dual Screens</text>

  <!-- Feedback outputs -->
  <line x1="390" y1="420" x2="390" y2="465" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="295" y="468" width="85" height="42" rx="10" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
  <text x="337" y="486" text-anchor="middle" font-size="14">🔊</text>
  <text x="337" y="502" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#34D399">Speaker</text>
  <text x="337" y="514" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#64748B">TTS audio</text>

  <rect x="398" y="468" width="87" height="42" rx="10" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="442" y="486" text-anchor="middle" font-size="14">👁️</text>
  <text x="442" y="502" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#A78BFA">Dual Screen</text>
  <text x="442" y="514" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#64748B">Visual alerts</text>

  <!-- ===== DETAILED AI INSIGHT PANEL ===== -->
  <rect x="30" y="270" width="250" height="280" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="155" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="url(#accent)">🔬 AI Analysis Detail</text>

  <!-- YOLO detection box -->
  <rect x="45" y="315" width="220" height="45" rx="8" fill="#1E293B" stroke="#76B900" stroke-width="1"/>
  <text x="155" y="333" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#76B900">YOLOv8n Object Detection</text>
  <text x="155" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#CBD5E1">person · car · stairs · dog · chair</text>

  <!-- Phi-3 reasoning box -->
  <rect x="45" y="370" width="220" height="45" rx="8" fill="#1E293B" stroke="#22D3EE" stroke-width="1"/>
  <text x="155" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#22D3EE">Phi-3 Mini 4K Reasoning</text>
  <text x="155" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#CBD5E1">Scene description · Navigation guidance</text>

  <!-- Face recognition box -->
  <rect x="45" y="425" width="220" height="45" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1"/>
  <text x="155" y="443" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#818CF8">Face Recognition</text>
  <text x="155" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#CBD5E1">Known person → speaks name</text>

  <!-- OCR box -->
  <rect x="45" y="480" width="220" height="45" rx="8" fill="#1E293B" stroke="#F472B6" stroke-width="1"/>
  <text x="155" y="498" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#F472B6">Tesseract OCR</text>
  <text x="155" y="515" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#CBD5E1">Signs · Door numbers · Documents</text>

  <!-- Cloud fallback -->
  <rect x="45" y="535" width="220" height="20" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="155" y="550" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#64748B">☁️ Cloud AI fallback: Groq · Gemini · Mistral</text>

  <!-- ===== EMERGENCY PIPELINE ===== -->
  <rect x="30" y="565" width="250" height="85" rx="12" fill="#0F172A" stroke="#F87171" stroke-width="1.5"/>
  <text x="155" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#F87171">🚨 EMERGENCY PIPELINE</text>
  <text x="155" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#CBD5E1">Triple-tap E-STOP (D9) → SMS via Quectel</text>
  <text x="155" y="626" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#CBD5E1">GPS location + alarm + red screen flash</text>
  <text x="155" y="642" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#64748B">Contacts from ~/.blind_assist_contacts</text>

  <!-- Emergency arrow -->
  <line x1="280" y1="600" x2="295" y2="600" stroke="#F87171" stroke-width="2" marker-end="url(#arrowRed)" stroke-dasharray="6,3"/>

  <!-- ===== RIGHT SIDE: FAILOVER CHAIN ===== -->
  <rect x="430" y="535" width="440" height="115" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="650" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="url(#accent)">📡 Connectivity Failover Chain</text>

  <rect x="448" y="575" width="90" height="50" rx="8" fill="#0F172A" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="493" y="598" text-anchor="middle" font-size="16">📶</text>
  <text x="493" y="618" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#22D3EE">WiFi</text>

  <text x="545" y="605" font-family="Arial,sans-serif" font-size="14" fill="#475569">→</text>

  <rect x="558" y="575" width="90" height="50" rx="8" fill="#0F172A" stroke="#F472B6" stroke-width="1.5"/>
  <text x="603" y="598" text-anchor="middle" font-size="16">📱</text>
  <text x="603" y="618" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#F472B6">4G LTE</text>

  <text x="655" y="605" font-family="Arial,sans-serif" font-size="14" fill="#475569">→</text>

  <rect x="668" y="575" width="90" height="50" rx="8" fill="#0F172A" stroke="#FB923C" stroke-width="1.5"/>
  <text x="713" y="598" text-anchor="middle" font-size="16">🔥</text>
  <text x="713" y="618" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#FB923C">Hotspot</text>

  <text x="765" y="605" font-family="Arial,sans-serif" font-size="14" fill="#475569">→</text>

  <rect x="778" y="575" width="80" height="50" rx="8" fill="#0F172A" stroke="#6366F1" stroke-width="1.5"/>
  <text x="818" y="598" text-anchor="middle" font-size="16">🕸️</text>
  <text x="818" y="618" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#6366F1">Tailscale</text>

  <text x="650" y="645" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">42 local AI models on Jetson for full offline operation — no internet required</text>

  <!-- ===== BOTTOM: LATENCY BAR ===== -->
  <rect x="30" y="665" width="840" height="55" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="690" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#CBD5E1">End-to-End Latency:</text>

  <!-- Latency segments -->
  <rect x="200" y="678" width="80" height="20" rx="6" fill="#FB923C" opacity="0.3"/>
  <text x="240" y="693" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FB923C">Capture 5ms</text>

  <rect x="290" y="678" width="80" height="20" rx="6" fill="#00979D" opacity="0.3"/>
  <text x="330" y="693" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#00979D">Route 30ms</text>

  <rect x="380" y="678" width="100" height="20" rx="6" fill="#76B900" opacity="0.3"/>
  <text x="430" y="693" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#76B900">YOLO 30ms</text>

  <rect x="490" y="678" width="100" height="20" rx="6" fill="#22D3EE" opacity="0.3"/>
  <text x="540" y="693" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#22D3EE">Phi-3 500ms</text>

  <rect x="600" y="678" width="90" height="20" rx="6" fill="#A78BFA" opacity="0.3"/>
  <text x="645" y="693" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#A78BFA">Return 30ms</text>

  <rect x="700" y="678" width="110" height="20" rx="6" fill="#34D399" opacity="0.3"/>
  <text x="755" y="693" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#34D399">Speak 200ms</text>

  <text x="860" y="693" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#FBBF24">~800ms total</text>

  <!-- Footer -->
  <text x="450" y="738" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#475569">The Tank Project · Blind-Assistance AI Pipeline · SENSE → SPEAK in ~800ms · APC-2026-RJ-75818</text>
</svg>