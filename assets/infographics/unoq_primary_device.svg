<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="unoq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00979D"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="jetson" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#76B900"/>
      <stop offset="100%" stop-color="#8BC34A"/>
    </linearGradient>
    <linearGradient id="esp32" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E44D26"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="url(#bg)" rx="16"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="url(#accent)">ARDUINO UNO Q — PRIMARY DEVICE</text>
  <text x="450" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#94A3B8">Competition APC-2026-RJ-75818 | System Coordinator Architecture</text>
  
  <!-- UNO Q Central Block -->
  <rect x="300" y="180" width="300" height="160" rx="16" fill="#1E293B" stroke="url(#unoq)" stroke-width="3" filter="url(#glow)"/>
  <text x="450" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#00B4D8">⚡ ARDUINO UNO Q 4GB</text>
  <text x="450" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94A3B8">SYSTEM COORDINATOR</text>
  
  <!-- UNO Q Dual Layer -->
  <rect x="310" y="240" width="135" height="85" rx="8" fill="#0F172A" stroke="#00979D" stroke-width="1"/>
  <text x="377" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#00B4D8">QRB2210 Linux</text>
  <text x="377" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#94A3B8">TankOS • GUI • Network</text>
  <text x="377" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#94A3B8">Device Discovery • Telemetry</text>
  <text x="377" y="308" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#94A3B8">Diagnostics • Configuration</text>
  
  <rect x="455" y="240" width="135" height="85" rx="8" fill="#0F172A" stroke="#00979D" stroke-width="1"/>
  <text x="522" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#00B4D8">STM32U585 MCU</text>
  <text x="522" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#94A3B8">Motors • Encoders • Servos</text>
  <text x="522" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#94A3B8">E-STOP • IMU • Safety</text>
  <text x="522" y="308" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#94A3B8">Watchdog • Battery Monitor</text>
  
  <!-- Jetson Block -->
  <rect x="50" y="100" width="200" height="120" rx="12" fill="#1E293B" stroke="url(#jetson)" stroke-width="2"/>
  <text x="150" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#76B900">🧠 JETSON ORIN NANO</text>
  <text x="150" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">67 TOPS AI Brain</text>
  <text x="150" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#CBD5E1">Vision • SLAM • Navigation</text>
  <text x="150" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#CBD5E1">YOLO • VLM • LLM • TensorRT</text>
  <text x="150" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#CBD5E1">200 AI Features</text>
  <text x="150" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#64748B">AI INFERENCE NODE</text>
  
  <!-- ESP32 Block -->
  <rect x="650" y="100" width="200" height="120" rx="12" fill="#1E293B" stroke="url(#esp32)" stroke-width="2"/>
  <text x="750" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#E44D26">📡 ESP32-S3 ×6</text>
  <text x="750" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">Distributed Peripherals</text>
  <text x="750" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#CBD5E1">Eye Displays • Hand Control</text>
  <text x="750" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#CBD5E1">Limb Sensors • Environment</text>
  <text x="750" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#CBD5E1">Audio Processing</text>
  <text x="750" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#64748B">SENSOR/ACTUATOR NODES</text>
  
  <!-- Android TV Block -->
  <rect x="350" y="420" width="200" height="80" rx="12" fill="#1E293B" stroke="#818CF8" stroke-width="2"/>
  <text x="450" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#818CF8">📺 ANDROID TV GUI</text>
  <text x="450" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">10-Foot Robot Interface</text>
  <text x="450" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#CBD5E1">Dashboard • Camera • Navigation • AI</text>
  <text x="450" y="493" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#64748B">HUMAN INTERACTION LAYER</text>
  
  <!-- Sensors Block -->
  <rect x="50" y="350" width="200" height="80" rx="12" fill="#1E293B" stroke="#FBBF24" stroke-width="2"/>
  <text x="150" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FBBF24">👁️ SENSORS</text>
  <text x="150" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">Camera + LiDAR + IMU</text>
  <text x="150" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#CBD5E1">USB Serial • I²C • UART</text>
  <text x="150" y="423" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#64748B">PERCEPTION INPUTS</text>
  
  <!-- Power Block -->
  <rect x="650" y="350" width="200" height="80" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
  <text x="750" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#EF4444">🔋 POWER SYSTEM</text>
  <text x="750" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">4S Li-ion 14.8V</text>
  <text x="750" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#CBD5E1">INA219 Monitoring • DC/DC</text>
  <text x="750" y="423" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#64748B">ENERGY MANAGEMENT</text>
  
  <!-- Connection Lines -->
  <!-- UNO Q ↔ Jetson -->
  <line x1="300" y1="240" x2="250" y2="180" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="245" y="200" font-family="Arial,sans-serif" font-size="9" fill="#76B900">Ethernet/USB</text>
  
  <!-- UNO Q ↔ ESP32 -->
  <line x1="600" y1="240" x2="650" y2="180" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="635" y="200" font-family="Arial,sans-serif" font-size="9" fill="#E44D26">WiFi/USB</text>
  
  <!-- UNO Q ↔ Android TV -->
  <line x1="450" y1="340" x2="450" y2="420" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="460" y="380" font-family="Arial,sans-serif" font-size="9" fill="#818CF8">DisplayPort</text>
  
  <!-- UNO Q ↔ Sensors -->
  <line x1="300" y1="300" x2="250" y2="370" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="240" y="345" font-family="Arial,sans-serif" font-size="9" fill="#FBBF24">I²C/GPIO</text>
  
  <!-- UNO Q ↔ Power -->
  <line x1="600" y1="300" x2="650" y2="370" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="640" y="345" font-family="Arial,sans-serif" font-size="9" fill="#EF4444">INA219</text>
  
  <!-- VPS/Cloud -->
  <rect x="50" y="500" width="150" height="50" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1"/>
  <text x="125" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#6366F1">🌐 VPS + Cloud</text>
  <text x="125" y="538" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#94A3B8">Optional Augmentation</text>
  
  <!-- Phone -->
  <rect x="700" y="500" width="150" height="50" rx="8" fill="#1E293B" stroke="#22D3EE" stroke-width="1"/>
  <text x="775" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#22D3EE">📱 PWA Dashboard</text>
  <text x="775" y="538" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#94A3B8">Phone Control Interface</text>
  
  <!-- LTE Modem -->
  <rect x="50" y="420" width="120" height="50" rx="8" fill="#1E293B" stroke="#34D399" stroke-width="1"/>
  <text x="110" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#34D399">📶 LTE Modem</text>
  <text x="110" y="458" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#94A3B8">SMS + Backup</text>
  
  <!-- Connection to VPS/Phone -->
  <line x1="300" y1="280" x2="125" y2="500" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="600" y1="280" x2="775" y2="500" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Key Labels -->
  <rect x="250" y="540" width="400" height="45" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="450" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94A3B8">UNO Q = System Coordinator • Jetson = AI Brain • ESP32 = Distributed Nodes</text>
  <text x="450" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#64748B">374 Features • 31 Modules Tested • Competition Primary Device</text>
  
  <!-- Priority Badge -->
  <rect x="690" y="25" width="180" height="30" rx="15" fill="#00979D" opacity="0.9"/>
  <text x="780" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">🏆 PRIMARY DEVICE</text>
</svg>