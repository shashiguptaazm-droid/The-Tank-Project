    <text x="170" y="766" text-anchor="middle" font-size="11" fill="#cbd5f0">2× 1.28" round LCDs · SPI</text>
    <text x="170" y="782" text-anchor="middle" font-size="10" fill="#93a4d8">Jetson ttyACM1</text>
  </g>
  <g>
    <rect x="300" y="718" width="220" height="72" rx="10" fill="#101830" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="410" y="744" text-anchor="middle" font-size="13" font-weight="bold" fill="#f0abfc">🎥 DFRobot AI Cam</text>
    <text x="410" y="766" text-anchor="middle" font-size="11" fill="#cbd5f0">OV3660 3MP · YOLO vision</text>
    <text x="410" y="782" text-anchor="middle" font-size="10" fill="#93a4d8">Jetson ttyACM0 · streaming</text>
  </g>
  <g>
    <rect x="540" y="718" width="220" height="72" rx="10" fill="#101830" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="650" y="744" text-anchor="middle" font-size="13" font-weight="bold" fill="#67e8f9">📷 ESP32-S3 CAM</text>
    <text x="650" y="766" text-anchor="middle" font-size="11" fill="#cbd5f0">ESPHome · WiFi .145</text>
    <text x="650" y="782" text-anchor="middle" font-size="10" fill="#93a4d8">unoq ttyACM0</text>
  </g>
  <g>
    <rect x="780" y="718" width="220" height="72" rx="10" fill="#101830" stroke="#34d399" stroke-width="1.5"/>
    <text x="890" y="744" text-anchor="middle" font-size="13" font-weight="bold" fill="#6ee7b7">📡 LD19 LiDAR</text>
    <text x="890" y="766" text-anchor="middle" font-size="11" fill="#cbd5f0">360° · SLAM</text>
    <text x="890" y="782" text-anchor="middle" font-size="10" fill="#93a4d8">Jetson ttyUSB0</text>
  </g>
  <g>
    <rect x="1020" y="718" width="220" height="72" rx="10" fill="#101830" stroke="#fb7185" stroke-width="1.5"/>
    <text x="1130" y="744" text-anchor="middle" font-size="13" font-weight="bold" fill="#fda4af">📶 EG800AK 4G LTE</text>
    <text x="1130" y="766" text-anchor="middle" font-size="11" fill="#cbd5f0">Cat 1 · cellular backup</text>
    <text x="1130" y="782" text-anchor="middle" font-size="10" fill="#93a4d8">Jetson ttyUSB1-3</text>
  </g>

  <!-- connector arrows between layers -->
  <line x1="640" y1="185" x2="640" y2="205" stroke="#6b739a" stroke-width="2"/>
  <line x1="640" y1="315" x2="640" y2="335" stroke="#6b739a" stroke-width="2"/>
  <line x1="640" y1="445" x2="640" y2="465" stroke="#6b739a" stroke-width="2"/>
  <line x1="640" y1="555" x2="640" y2="575" stroke="#6b739a" stroke-width="2"/>

