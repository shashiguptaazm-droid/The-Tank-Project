    <text x="1165" y="184" text-anchor="middle" font-size="10" fill="#cbd5f0">Nextcloud</text>
    <text x="1165" y="200" text-anchor="middle" font-size="10" fill="#cbd5f0">webdav · nginx</text>
    <text x="1165" y="216" text-anchor="middle" font-size="10" fill="#4ade80">● 100.71.127.19</text>
