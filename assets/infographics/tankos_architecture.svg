  <rect width="1280" height="900" fill="url(#bg)"/>

  <text x="640" y="50" text-anchor="middle" font-size="30" font-weight="bold" fill="#eef2ff">TANKOS — SYSTEM ARCHITECTURE</text>
  <text x="640" y="80" text-anchor="middle" font-size="15" fill="#8b93b5">Jetson brain · Arduino UNO Q controller · ESP32 peripherals · VPS cloud</text>
  <line x1="300" y1="94" x2="980" y2="94" stroke="#2a3560" stroke-width="2"/>

  <!-- Layer 5: Tank Shell (top) -->
  <g>
    <rect x="240" y="115" width="800" height="70" rx="12" fill="url(#l5)" stroke="#f472b6" stroke-width="1.5"/>
    <text x="640" y="145" text-anchor="middle" font-size="17" font-weight="bold" fill="#fbcfe8">TANK SHELL · WEB · DESKTOP</text>
    <text x="640" y="168" text-anchor="middle" font-size="12" fill="#f9a8d4">TankOS web terminal (ttyd) · USB Devices GUI · TankDashboard · x11vnc desktop</text>
  </g>

  <!-- Layer 4: Core Managers -->
  <g>
    <rect x="240" y="205" width="800" height="110" rx="12" fill="url(#l4)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="640" y="233" text-anchor="middle" font-size="17" font-weight="bold" fill="#fde68a">TANKOS CORE MANAGERS</text>
    <text x="340" y="262" font-size="12" fill="#fcd34d">Hardware · Network · Storage</text>
    <text x="340" y="284" font-size="12" fill="#fcd34d">Power · Security · Diagnostics</text>
    <text x="700" y="262" font-size="12" fill="#fcd34d">Emotion (eyes) · Robot (motion)</text>
    <text x="700" y="284" font-size="12" fill="#fcd34d">Vision · Navigation · Voice · Display</text>
  </g>

  <!-- Layer 3: Robotics (tank_ws ROS2) -->
  <g>
    <rect x="240" y="335" width="800" height="110" rx="12" fill="url(#l3)" stroke="#34d399" stroke-width="1.5"/>
    <text x="640" y="363" text-anchor="middle" font-size="17" font-weight="bold" fill="#a7f3d0">ROBOTICS LAYER — 16 ROS2 packages (ament_python)</text>
    <text x="340" y="392" font-size="12" fill="#6ee7b7">tank_motion (BTS7960 + PCA9685)</text>
    <text x="340" y="414" font-size="12" fill="#6ee7b7">tank_vision (YOLO + eye bridge)</text>
    <text x="340" y="436" font-size="12" fill="#6ee7b7">tank_navigation (SLAM / LiDAR)</text>
    <text x="700" y="392" font-size="12" fill="#6ee7b7">tank_sensors (IMU · LiDAR · thermal)</text>
    <text x="700" y="414" font-size="12" fill="#6ee7b7">tank_speech · tank_text · tank_memory</text>
    <text x="700" y="436" font-size="12" fill="#6ee7b7">tank_assistant (LLM + RAG) · tank_health</text>
  </g>

  <!-- Layer 2: AI Brain -->
  <g>
    <rect x="240" y="465" width="800" height="90" rx="12" fill="url(#l2)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="640" y="495" text-anchor="middle" font-size="17" font-weight="bold" fill="#a5f3fc">AI BRAIN — NVIDIA JETSON ORIN NANO SUPER</text>
    <text x="640" y="520" text-anchor="middle" font-size="12" fill="#67e8f9">JetPack / Ubuntu · 8 GB · GPU (nvgpu) · AIManager + Evolution Bridge</text>
    <text x="640" y="542" text-anchor="middle" font-size="12" fill="#67e8f9">WiFi .74 · Tailscale 100.122.31.46 · 4G LTE failover (EG800AK-CN)</text>
  </g>

  <!-- Layer 1: Real-time Controller -->
  <g>
    <rect x="240" y="575" width="800" height="90" rx="12" fill="url(#l1)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="640" y="605" text-anchor="middle" font-size="17" font-weight="bold" fill="#c7d2fe">REAL-TIME CONTROLLER — ARDUINO UNO Q (unoq)</text>
    <text x="640" y="630" text-anchor="middle" font-size="12" fill="#a5b4fc">Debian 13 · WiFi .72 · Tailscale 100.84.235.7 · OpenVPN tun0</text>
    <text x="640" y="652" text-anchor="middle" font-size="12" fill="#a5b4fc">Deterministic motor/sensor I/O · USB serial bridge ↔ Jetson</text>
  </g>

  <!-- Peripherals row -->
  <text x="640" y="700" text-anchor="middle" font-size="16" font-weight="bold" fill="#eef2ff">HARDWARE PERIPHERALS</text>

