  <text x="640" y="850" text-anchor="middle" font-size="11" fill="#6b739a">Architecture details: docs/ARCHITECTURE.md · hardware mapping: docs/HARDWARE_DEPENDENCIES.md · fleet: docs/FLEET_INVENTORY.md</text>
  <text x="640" y="876" text-anchor="middle" font-size="11" fill="#6b739a">Network: WiFi → LTE → Hotspot → Tailscale · photos: docs/hardware_photos/ · eyes animation: assets/gifs/eyes_expressions.gif</text>
