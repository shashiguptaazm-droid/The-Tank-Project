<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1A"/>
      <stop offset="100%" stop-color="#131C2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1000" height="800" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="url(#accent)">🦯 ANIMATED FLOW CHART — SENSE → SPEAK Pipeline</text>
  <text x="500" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748B">Step-by-step animation: frame capture → route → AI analysis → spoken guidance · ~800ms end-to-end</text>

  <!-- ===== STAGE 1: SENSE ===== -->
  <g opacity="1">
    <rect x="30" y="80" width="200" height="110" rx="16" fill="#1E293B" stroke="#FB923C" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;1;0.5" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="130" y="112" text-anchor="middle" font-size="30">📷</text>
    <text x="130" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FB923C">SENSE</text>
    <text x="130" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#CBD5E1">ESP32-S3 CAM</text>
    <text x="130" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">640×480 JPEG @ 8.9fps</text>
    <text x="130" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#475569">Chest-mounted · Night Vision</text>

    <!-- Step number -->
    <circle cx="50" cy="100" r="14" fill="#FB923C">
      <animate attributeName="r" values="14;16;14" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="50" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white">1</text>
  </g>

  <!-- Arrow 1→2 -->
  <g>
    <line x1="230" y1="135" x2="300" y2="135" stroke="#FB923C" stroke-width="3"/>
    <polygon points="300,130 320,135 300,140" fill="#FB923C"/>
    <circle cx="270" cy="135" r="4" fill="#FB923C" filter="url(#glow)">
      <animate attributeName="cx" values="240;310" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="265" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#FB923C">WiFi ~5ms</text>
  </g>

  <!-- ===== STAGE 2: ROUTE ===== -->
  <g opacity="1">
    <rect x="320" y="80" width="200" height="110" rx="16" fill="#1E293B" stroke="#00979D" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;0.5;1;1;0.5" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="420" y="112" text-anchor="middle" font-size="30">⚡</text>
    <text x="420" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#00979D">ROUTE</text>
    <text x="420" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#CBD5E1">Arduino UNO Q</text>
    <text x="420" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">QRB2210 + STM32U585</text>
    <text x="420" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#475569">USB-C hub · Belt-mounted</text>

    <!-- LTE/WiFi choice -->
    <rect x="320" y="198" width="200" height="22" rx="6" fill="#0F172A" stroke="#334155" stroke-width="0.5">
      <animate attributeName="stroke" values="#334155;#00979D;#334155" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="420" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#64748B">WiFi → 4G LTE → Hotspot → Tailscale</text>

    <circle cx="340" cy="100" r="14" fill="#00979D">
      <animate attributeName="r" values="14;16;14" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="340" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white">2</text>
  </g>

  <!-- Arrow 2→3 -->
  <g>
    <line x1="520" y1="135" x2="590" y2="135" stroke="#22D3EE" stroke-width="3"/>
    <polygon points="590,130 610,135 590,140" fill="#22D3EE"/>
    <circle cx="560" cy="135" r="4" fill="#22D3EE" filter="url(#glow)">
      <animate attributeName="cx" values="530;600" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <text x="555" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#22D3EE">Tailscale ~30ms</text>
  </g>

  <!-- ===== STAGE 3: ANALYZE ===== -->
  <g opacity="1">
    <rect x="610" y="80" width="360" height="110" rx="16" fill="#1E293B" stroke="#76B900" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;0.5;0.5;1;1;0.5" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="790" y="112" text-anchor="middle" font-size="30">🧠</text>
    <text x="790" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#76B900">ANALYZE — Jetson Orin Nano Super</text>
    <text x="790" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#CBD5E1">67 TOPS CUDA GPU · YOLOv8n · Phi-3 4K · Tesseract OCR · Whisper</text>
    <text x="790" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">Home/Backpack · 42 local AI models · Cloud fallback via VPS</text>
    <text x="790" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#475569">Processing: ~500ms · 42 models for offline use</text>

    <!-- AI pipeline mini boxes -->
    <rect x="625" y="198" width="68" height="14" rx="5" fill="#0F172A" stroke="#76B900" stroke-width="0.5"/>
    <text x="659" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#76B900">YOLO 30ms</text>

    <rect x="698" y="198" width="68" height="14" rx="5" fill="#0F172A" stroke="#22D3EE" stroke-width="0.5"/>
    <text x="732" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#22D3EE">Phi-3 500ms</text>

    <rect x="771" y="198" width="68" height="14" rx="5" fill="#0F172A" stroke="#818CF8" stroke-width="0.5"/>
    <text x="805" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#818CF8">OCR 200ms</text>

    <rect x="844" y="198" width="68" height="14" rx="5" fill="#0F172A" stroke="#F472B6" stroke-width="0.5"/>
    <text x="878" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#F472B6">Face</text>

    <!-- Cloud fallback -->
    <rect x="625" y="216" width="340" height="14" rx="5" fill="#0F172A" stroke="#334155" stroke-width="0.5" stroke-dasharray="3,2"/>
    <text x="795" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#64748B">☁️ Cloud fallback: Groq · Gemini · OpenRouter · Mistral — if Jetson unreachable</text>

    <circle cx="630" cy="100" r="14" fill="#76B900">
      <animate attributeName="r" values="14;16;14" dur="1.5s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="630" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white">3</text>
  </g>

  <!-- Arrow 3→4 -->
  <g>
    <line x1="790" y1="238" x2="790" y2="308" stroke="#A78BFA" stroke-width="3"/>
    <polygon points="785,308 790,328 795,308" fill="#A78BFA"/>
    <circle cx="790" cy="278" r="4" fill="#A78BFA" filter="url(#glow)">
      <animate attributeName="cy" values="248;318" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="805" y="270" font-family="Arial,sans-serif" font-size="7" fill="#A78BFA">Tailscale ← ~30ms</text>
  </g>

  <!-- ===== STAGE 4: RETURN ===== -->
  <g opacity="1">
    <rect x="660" y="330" width="260" height="100" rx="16" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5">
      <animate attributeName="opacity" values="0.5;0.5;0.5;0.5;1;1;0.5" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="790" y="360" text-anchor="middle" font-size="26">📨</text>
    <text x="790" y="386" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#A78BFA">RETURN</text>
    <text x="790" y="404" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#CBD5E1">Structured analysis packet</text>
    <text x="790" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">Objects · People · Text · Guidance · Audio text</text>

    <circle cx="680" cy="350" r="14" fill="#A78BFA">
      <animate attributeName="r" values="14;16;14" dur="1.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="680" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white">4</text>
  </g>

  <!-- Arrow 4→5 -->
  <g>
    <line x1="660" y1="380" x2="590" y2="380" stroke="#A78BFA" stroke-width="3"/>
    <polygon points="590,375 570,380 590,385" fill="#A78BFA"/>
    <circle cx="620" cy="380" r="4" fill="#A78BFA" filter="url(#glow)">
      <animate attributeName="cx" values="650;580" dur="1.2s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== STAGE 5: FEEDBACK ===== -->
  <g opacity="1">
    <rect x="380" y="330" width="180" height="100" rx="16" fill="#1E293B" stroke="#34D399" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;0.5;0.5;0.5;0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="470" y="360" text-anchor="middle" font-size="26">🗣️</text>
    <text x="470" y="386" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#34D399">FEEDBACK</text>
    <text x="470" y="404" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#CBD5E1">Audio + Visual Output</text>
    <text x="470" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">Speaker · Dual Screens</text>

    <circle cx="400" cy="350" r="14" fill="#34D399">
      <animate attributeName="r" values="14;16;14" dur="1.5s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="400" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white">5</text>
  </g>

  <!-- Feedback outputs -->
  <line x1="470" y1="430" x2="470" y2="478" stroke="#34D399" stroke-width="2.5"/>

  <rect x="380" y="480" width="85" height="50" rx="12" fill="#1E293B" stroke="#34D399" stroke-width="2">
    <animate attributeName="opacity" values="0.5;0.5;0.5;0.5;0.5;0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="422" y="505" text-anchor="middle" font-size="18">🔊</text>
  <text x="422" y="522" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#34D399">Speaker</text>

  <rect x="475" y="480" width="85" height="50" rx="12" fill="#1E293B" stroke="#A78BFA" stroke-width="2">
    <animate attributeName="opacity" values="0.5;0.5;0.5;0.5;0.5;0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="517" y="505" text-anchor="middle" font-size="18">👁️</text>
  <text x="517" y="522" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#A78BFA">Dual Screen</text>

  <!-- ===== ANIMATED EXAMPLE SCENE (right side) ===== -->
  <rect x="30" y="480" width="330" height="200" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="195" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#FBBF24">🎬 Live Scene Analysis Example</text>

  <!-- Example frame (animated: objects pop in) -->
  <rect x="50" y="520" width="290" height="60" rx="8" fill="#1A2540" stroke="#334155" stroke-width="1"/>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;1;1;1;1;1" dur="6s" repeatCount="indefinite"/>
    <text x="65" y="540" font-family="Arial,sans-serif" font-size="11" fill="#FB923C">📷 Frame captured: 640×480, 18 KB JPEG</text>
    <text x="65" y="558" font-family="Arial,sans-serif" font-size="10" fill="#CBD5E1">Detected: person (94%), door (87%), stairs (91%),</text>
    <text x="65" y="574" font-family="Arial,sans-serif" font-size="10" fill="#CBD5E1">chair (78%), sign text: "EXIT →"</text>
  </g>

  <!-- Spoken output -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;1;1;1;1;1" dur="6s" repeatCount="indefinite"/>
    <rect x="50" y="590" width="290" height="35" rx="8" fill="#1A2540" stroke="#34D399" stroke-width="1"/>
    <text x="195" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#34D399">🔊 "Door ahead, 5 meters.</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;1;1;1;1" dur="6s" repeatCount="indefinite"/>
    <text x="195" y="632" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#34D399">   Person on your left. Stairs going down.</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;1" dur="6s" repeatCount="indefinite"/>
    <text x="195" y="652" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#34D399">   Exit sign to your right. Path is clear."</text>
  </g>

  <!-- ===== BOTTOM: TIMING BAR ===== -->
  <rect x="30" y="700" width="940" height="60" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="725" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#CBD5E1">Timeline:</text>

  <!-- Timing segments with animation -->
  <rect x="150" y="714" width="80" height="22" rx="6" fill="#FB923C" opacity="0.3">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="190" y="729" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FB923C">Capture 5ms</text>

  <text x="235" y="729" font-family="Arial,sans-serif" font-size="10" fill="#475569">→</text>

  <rect x="245" y="714" width="80" height="22" rx="6" fill="#00979D" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.3;1;0.3;0.3" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="285" y="729" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#00979D">Route 30ms</text>

  <text x="330" y="729" font-family="Arial,sans-serif" font-size="10" fill="#475569">→</text>

  <rect x="340" y="714" width="90" height="22" rx="6" fill="#76B900" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.3;0.3;1;0.3;0.3" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="385" y="729" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#76B900">YOLO 30ms</text>

  <text x="435" y="729" font-family="Arial,sans-serif" font-size="10" fill="#475569">→</text>

  <rect x="445" y="714" width="100" height="22" rx="6" fill="#22D3EE" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.3;0.3;0.3;1;0.3;0.3" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="495" y="729" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#22D3EE">Phi-3 500ms</text>

  <text x="550" y="729" font-family="Arial,sans-serif" font-size="10" fill="#475569">→</text>

  <rect x="560" y="714" width="90" height="22" rx="6" fill="#A78BFA" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.3;0.3;0.3;0.3;1;0.3" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="605" y="729" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#A78BFA">Return 30ms</text>

  <text x="655" y="729" font-family="Arial,sans-serif" font-size="10" fill="#475569">→</text>

  <rect x="665" y="714" width="90" height="22" rx="6" fill="#34D399" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.3;0.3;0.3;0.3;0.3;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="710" y="729" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#34D399">Speak 200ms</text>

  <text x="800" y="729" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#FBBF24">Total: ~800ms</text>

  <!-- Progress bar -->
  <rect x="150" y="742" width="700" height="6" rx="3" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <rect x="150" y="742" width="0" height="6" rx="3" fill="#22D3EE" opacity="0.6">
    <animate attributeName="width" values="0;700" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Footer -->
  <text x="500" y="788" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#475569">The Tank Project · Blind-Assistance Pipeline · SENSE → SPEAK · APC-2026-RJ-75818</text>
</svg>