# The Tank Project — Samba (/etc/samba/smb.conf tail)
#
# Snippet; append to /etc/samba/smb.conf during provisioning.

[tank_media]
   comment = The Tank Project media + recordings
   path = /var/tank/media
   browseable = yes
   read only = no
   writable  = yes
   create mask = 0664
   directory mask = 0775
   force user = pi
   force group = pi
   guest ok = no
   valid users = tank_smb_user
