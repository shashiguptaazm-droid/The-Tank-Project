<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.1"/></filter>
  </defs>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="800" fill="#0F172A">Wiring Schematic — The Tank Project</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#64748B">Arduino UNO Q ↔ Jetson Orin Nano ↔ Peripherals</text>

  <!-- ===== JETSON (right side) ===== -->
  <rect x="540" y="80" width="310" height="240" rx="10" fill="#F0FDF4" stroke="#4ADE80" stroke-width="2" filter="url(#shadow)"/>
  <text x="695" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">🖥️ Jetson Orin Nano</text>
  <text x="695" y="122" text-anchor="middle" font-size="10" fill="#15803D">AI Brain · ROS 2 · TankOS</text>

  <!-- Jetson USB ports -->
  <rect x="560" y="135" width="130" height="22" rx="4" fill="#DCFCE7"/>
  <text x="625" y="150" text-anchor="middle" font-size="9" fill="#166534">USB-A → Arduino</text>

  <rect x="700" y="135" width="130" height="22" rx="4" fill="#DCFCE7"/>
  <text x="765" y="150" text-anchor="middle" font-size="9" fill="#166534">USB-A → Webcam</text>

  <rect x="560" y="163" width="130" height="22" rx="4" fill="#DCFCE7"/>
  <text x="625" y="178" text-anchor="middle" font-size="9" fill="#166534">USB-A → LiDAR</text>

  <rect x="700" y="163" width="130" height="22" rx="4" fill="#DCFCE7"/>
  <text x="765" y="178" text-anchor="middle" font-size="9" fill="#166534">USB-A → ESP32 Eyes</text>

  <rect x="560" y="191" width="130" height="22" rx="4" fill="#DCFCE7"/>
  <text x="625" y="206" text-anchor="middle" font-size="9" fill="#166534">USB-A → ReSpeaker</text>

  <rect x="700" y="191" width="130" height="22" rx="4" fill="#DCFCE7"/>
  <text x="765" y="206" text-anchor="middle" font-size="9" fill="#166534">USB-A → Speakers</text>

  <!-- Jetson power -->
  <rect x="560" y="225" width="270" height="30" rx="4" fill="#BBF7D0"/>
  <text x="695" y="244" text-anchor="middle" font-size="10" fill="#166534">⚡ 19V DC Barrel Jack PSU — separate rail</text>

  <!-- Jetson storage -->
  <rect x="560" y="263" width="270" height="22" rx="4" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="695" y="278" text-anchor="middle" font-size="9" fill="#166534">💾 M.2 NVMe 256GB · MicroSD 64GB (boot)</text>

  <!-- ===== ARDUINO (left) ===== -->
  <rect x="50" y="80" width="440" height="240" rx="10" fill="#F0FDFA" stroke="#14B8A6" stroke-width="2" filter="url(#shadow)"/>
  <text x="270" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#0F766E">⚡ Arduino UNO Q</text>
  <text x="270" y="122" text-anchor="middle" font-size="10" fill="#0D9488">Real-time Motor &amp; Sensor Controller · Arm Cortex-M4 48MHz</text>

  <!-- Arduino pin rows -->
  <g font-size="9">
    <!-- D2-D3 (encoders) -->
    <rect x="65" y="135" width="95" height="22" rx="4" fill="#CCFBF1"/>
    <text x="112" y="150" text-anchor="middle" fill="#0F766E">D2 · INT0</text>
    <text x="165" y="150" font-size="8" fill="#5EEAD4">← Left Enc A</text>

    <rect x="65" y="163" width="95" height="22" rx="4" fill="#CCFBF1"/>
    <text x="112" y="178" text-anchor="middle" fill="#0F766E">D3 · INT1</text>
    <text x="165" y="178" font-size="8" fill="#5EEAD4">← Left Enc B</text>

    <!-- D4-D7 (motor) -->
    <rect x="65" y="191" width="95" height="22" rx="4" fill="#FEF3C7"/>
    <text x="112" y="206" text-anchor="middle" fill="#92400E">D4 · DIR_R</text>
    <text x="165" y="206" font-size="8" fill="#FBBF24">→ BTS7960 B</text>

    <rect x="65" y="219" width="95" height="22" rx="4" fill="#FEF3C7"/>
    <text x="112" y="234" text-anchor="middle" fill="#92400E">D5 · PWM_R</text>
    <text x="165" y="234" font-size="8" fill="#FBBF24">→ BTS7960 B</text>

    <rect x="65" y="247" width="95" height="22" rx="4" fill="#FEF3C7"/>
    <text x="112" y="262" text-anchor="middle" fill="#92400E">D6 · PWM_L</text>
    <text x="165" y="262" font-size="8" fill="#FBBF24">→ BTS7960 A</text>

    <rect x="65" y="275" width="95" height="22" rx="4" fill="#FEF3C7"/>
    <text x="112" y="290" text-anchor="middle" fill="#92400E">D7 · DIR_L</text>
    <text x="165" y="290" font-size="8" fill="#FBBF24">→ BTS7960 A</text>

    <!-- D8-D9 (E-STOP) -->
    <rect x="280" y="135" width="95" height="22" rx="4" fill="#FEE2E2"/>
    <text x="327" y="150" text-anchor="middle" fill="#991B1B">D8 · ESTOP LED</text>
    <text x="380" y="150" font-size="8" fill="#FCA5A5">→ Latched HIGH</text>

    <rect x="280" y="163" width="95" height="22" rx="4" fill="#FEE2E2"/>
    <text x="327" y="178" text-anchor="middle" fill="#991B1B">D9 · ESTOP IN</text>
    <text x="380" y="178" font-size="8" fill="#FCA5A5">← Mushroom btn</text>

    <!-- D18-D19 (right encoder) -->
    <rect x="280" y="191" width="95" height="22" rx="4" fill="#CCFBF1"/>
    <text x="327" y="206" text-anchor="middle" fill="#0F766E">D18 · Right Enc A</text>
    <text x="380" y="206" font-size="8" fill="#5EEAD4">← Right motor</text>

    <rect x="280" y="219" width="95" height="22" rx="4" fill="#CCFBF1"/>
    <text x="327" y="234" text-anchor="middle" fill="#0F766E">D19 · Right Enc B</text>
    <text x="380" y="234" font-size="8" fill="#5EEAD4">← Right motor</text>

    <!-- I2C -->
    <rect x="280" y="247" width="95" height="22" rx="4" fill="#E0E7FF"/>
    <text x="327" y="262" text-anchor="middle" fill="#3730A3">A4 · SDA</text>
    <text x="380" y="262" font-size="8" fill="#818CF8">→ I²C bus</text>

    <rect x="280" y="275" width="95" height="22" rx="4" fill="#E0E7FF"/>
    <text x="327" y="290" text-anchor="middle" fill="#3730A3">A5 · SCL</text>
    <text x="380" y="290" font-size="8" fill="#818CF8">→ I²C bus</text>
  </g>

  <!-- ===== I²C BUS ===== -->
  <rect x="50" y="345" width="800" height="110" rx="10" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#4338CA">🔌 I²C Bus (Arduino A4/A5) — 400 kHz</text>

  <g font-size="10">
    <rect x="70" y="383" width="145" height="40" rx="6" fill="#fff" stroke="#C7D2FE"/>
    <text x="142" y="400" text-anchor="middle" font-weight="600" fill="#1E40AF">BNO055 IMU</text>
    <text x="142" y="415" text-anchor="middle" font-size="8" fill="#6366F1">0x28 · 9-DOF</text>

    <rect x="230" y="383" width="145" height="40" rx="6" fill="#fff" stroke="#C7D2FE"/>
    <text x="302" y="400" text-anchor="middle" font-weight="600" fill="#1E40AF">PCA9685</text>
    <text x="302" y="415" text-anchor="middle" font-size="8" fill="#6366F1">0x40 · 16ch PWM</text>

    <rect x="390" y="383" width="145" height="40" rx="6" fill="#fff" stroke="#C7D2FE"/>
    <text x="462" y="400" text-anchor="middle" font-weight="600" fill="#1E40AF">SH1106 OLED</text>
    <text x="462" y="415" text-anchor="middle" font-size="8" fill="#6366F1">0x70 · 1.3″</text>

    <rect x="550" y="383" width="145" height="40" rx="6" fill="#fff" stroke="#C7D2FE"/>
    <text x="622" y="400" text-anchor="middle" font-weight="600" fill="#1E40AF">SG90 Servo ×2</text>
    <text x="622" y="415" text-anchor="middle" font-size="8" fill="#6366F1">via PCA9685</text>

    <rect x="710" y="383" width="120" height="40" rx="6" fill="#fff" stroke="#C7D2FE"/>
    <text x="770" y="400" text-anchor="middle" font-weight="600" fill="#1E40AF">Reserved</text>
    <text x="770" y="415" text-anchor="middle" font-size="8" fill="#6366F1">0x5A · UART</text>
  </g>

  <!-- ===== Motor Drivers ===== -->
  <rect x="50" y="475" width="385" height="95" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="242" y="498" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">🔧 BTS7960 Motor Driver A (Left)</text>

  <g font-size="9">
    <rect x="65" y="510" width="60" height="20" rx="3" fill="#FEE2E2"/>
    <text x="95" y="524" text-anchor="middle" fill="#991B1B">D7 DIR</text>
    <text x="130" y="524" fill="#DC2626">→ LPWM pin</text>

    <rect x="200" y="510" width="60" height="20" rx="3" fill="#FEE2E2"/>
    <text x="230" y="524" text-anchor="middle" fill="#991B1B">D6 PWM</text>
    <text x="265" y="524" fill="#DC2626">→ RPWM pin</text>

    <text x="130" y="552" font-size="8" fill="#991B1B">Motor A: 12V DC → JGB37-520 (Left track)</text>
    <text x="130" y="564" font-size="8" fill="#991B1B">Encoder A/B → D2, D3 (quadrature counting)</text>
  </g>

  <rect x="465" y="475" width="385" height="95" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="657" y="498" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">🔧 BTS7960 Motor Driver B (Right)</text>

  <g font-size="9">
    <rect x="480" y="510" width="60" height="20" rx="3" fill="#FEE2E2"/>
    <text x="510" y="524" text-anchor="middle" fill="#991B1B">D4 DIR</text>
    <text x="545" y="524" fill="#DC2626">→ LPWM pin</text>

    <rect x="615" y="510" width="60" height="20" rx="3" fill="#FEE2E2"/>
    <text x="645" y="524" text-anchor="middle" fill="#991B1B">D5 PWM</text>
    <text x="680" y="524" fill="#DC2626">→ RPWM pin</text>

    <text x="545" y="552" font-size="8" fill="#991B1B">Motor B: 12V DC → JGB37-520 (Right track)</text>
    <text x="545" y="564" font-size="8" fill="#991B1B">Encoder A/B → D18, D19 (quadrature counting)</text>
  </g>

  <!-- ===== DATA FLOW ===== -->
  <rect x="50" y="590" width="800" height="80" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="450" y="615" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">📡 Data Flow — Serial Bridge Protocol (115200 baud · USB-C)</text>
  
  <g font-size="9">
    <!-- Jetson → Arduino -->
    <rect x="70" y="630" width="360" height="30" rx="4" fill="#DBEAFE"/>
    <text x="250" y="649" text-anchor="middle" fill="#1E40AF">Jetson → Arduino:  {cmd: "move", vel: [0.2, 0], lights: "on", pan: 45, tilt: -10}</text>

    <!-- Arduino → Jetson -->
    <rect x="470" y="630" width="360" height="30" rx="4" fill="#FEF3C7"/>
    <text x="650" y="649" text-anchor="middle" fill="#92400E">Arduino → Jetson:  {enc: [1234, 5678], imu: {yaw: 45.2}, estop: false, bat: 11.8}</text>
  </g>

</svg>