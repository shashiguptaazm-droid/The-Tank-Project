name: MediGyaan

options:
  bundleIdPrefix: com.corp
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  useBaseInternationalization: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

# LiveKit Swift SDK. Replaces the Jitsi Meet SDK the Android app uses, and
# talks to our own SFU at wss://medigyaan.com/rtc rather than meet.jit.si.
#
# 2.16.0 needs swift-tools-version 6.1, i.e. Xcode 16.3 or newer. The product and
# module are both named `LiveKit` (older 2.x releases called the product
# `LiveKitClient`), and `SwiftUIVideoView` ships inside it, so no separate
# components package is required.
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.16.0

targets:
  MediGyaan:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MediGyaan
        excludes:
          - "**/*.md"
          # Referenced via INFOPLIST_FILE; must not also ship as a resource.
          - "Resources/Info.plist"
    dependencies:
      - package: LiveKit
        product: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corp.medigyaan
        PRODUCT_NAME: MediGyaan
        MARKETING_VERSION: "4.0"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MediGyaan/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES

  MediGyaanTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MediGyaanTests
    dependencies:
      - target: MediGyaan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corp.medigyaan.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  MediGyaan:
    build:
      targets:
        MediGyaan: all
        MediGyaanTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MediGyaanTests
