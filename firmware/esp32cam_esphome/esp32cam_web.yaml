# ESPHome config for ESP32-S3 CAM on UNO Q (USB-C)
# Flash this via ESPHome dashboard or CLI:
#   esphome run esp32cam_web.yaml
#
# After flash: camera serves at http://<esp32-ip>/ (web UI)
#   Snapshot:   http://<esp32-ip>/camera.jpg
#   Stream:     http://<esp32-ip>:81/stream

esphome:
  name: tank-esp32cam
  friendly_name: "Tank ESP32-S3 CAM"

esp32:
  board: esp32s3dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:

# Enable OTA updates
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable web server for camera access
web_server:
  port: 80

# Camera component
camera:
  - platform: esp32_camera
    name: "Tank Camera"
    id: tank_camera

    # ESP32-S3 AI Camera v1.1 (DFRobot SEN0611) pin mapping
    # or generic ESP32-S3 CAM pin mapping
    data_pins: [GPIO4, GPIO5, GPIO6, GPIO7, GPIO14, GPIO17, GPIO21, GPIO18, GPIO16]
    power_pin: GPIO-1
    vsync_pin: GPIO1
    href_pin: GPIO2
    pclk_pin: GPIO15
    xclk_pin: GPIO0

    # Camera sensor config
    resolution: VGA_640X480
    fps: 15

    # JPEG quality (lower = better quality, higher = smaller file)
    jpeg_quality: 12

    # Flash LED
    flash_pin: GPIO47

# Expose camera on web server
  - platform: web_server
    port: 80

# Deep sleep to save power (optional)
# deep_sleep:
#   run_duration: 30s
#   sleep_duration: 10s
