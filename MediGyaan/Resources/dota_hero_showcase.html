    // Utility: Hex string to RGBA helper
    function hexToRgba(hexStr, alpha) {
      let c = hexStr.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      const r = (num >> 16) & 255;
      const g = (num >> 8) & 255;
      const b = num & 255;
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }

    // Procedural sigil texture generator for the back of the medallion
    function createSigilCanvasTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Dark celestial backdrop
      const bgGrad = ctx.createRadialGradient(256, 256, 40, 256, 256, 256);
      bgGrad.addColorStop(0, '#10162a');
      bgGrad.addColorStop(0.7, '#070b16');
      bgGrad.addColorStop(1, '#02040a');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 512, 512);

      // Gold astrological rings
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(256, 256, 230, 0, Math.PI * 2);
      ctx.stroke();

      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(256, 256, 210, 0, Math.PI * 2);
      ctx.stroke();

      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(256, 256, 170, 0, Math.PI * 2);
      ctx.stroke();

      // Constellation star points
      ctx.fillStyle = '#ffd700';
      const numPoints = 12;
      for (let i = 0; i < numPoints; i++) {
        const angle = (Math.PI * 2 / numPoints) * i;
        const x = 256 + Math.cos(angle) * 190;
        const y = 256 + Math.sin(angle) * 190;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();

        // Radiating lines
        ctx.strokeStyle = 'rgba(212, 175, 55, 0.35)';
        ctx.beginPath();
        ctx.moveTo(256, 256);
        ctx.lineTo(x, y);
        ctx.stroke();
      }

      // Central octagram
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 3;
      for (let k = 0; k < 2; k++) {
        const offset = (Math.PI / 4) * k;
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          const a = offset + (Math.PI / 2) * i;
          const px = 256 + Math.cos(a) * 110;
          const py = 256 + Math.sin(a) * 110;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      }

      // Core seal text
      ctx.fillStyle = '#fde047';
      ctx.font = 'bold 24px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('CURIA ARCANA', 256, 256);

      ctx.font = '14px sans-serif';
      ctx.fillStyle = 'rgba(253, 224, 71, 0.7)';
      ctx.fillText('• NOCTIS DOMINUS •', 256, 285);

      const texture = new THREE.CanvasTexture(canvas);
      return texture;
    }

    // Procedural runic ring for pedestal
    function createRunicRingTexture(accentHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 1024, 1024);

      const c = '#' + accentHex.toString(16).padStart(6, '0');
      ctx.strokeStyle = c;
      ctx.shadowColor = c;
      ctx.shadowBlur = 12;

      // Outer & inner boundary
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(512, 512, 480, 0, Math.PI * 2);
      ctx.stroke();

      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(512, 512, 430, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(512, 512, 320, 0, Math.PI * 2);
      ctx.stroke();

      // Mystic glyph symbols
      const runes = ['᚛', '᚜', 'ᚠ', 'ᚢ', 'ᚦ', 'ᚨ', 'ᚱ', 'ᚲ', 'ᚷ', 'ᚹ', 'ᚺ', 'ᚾ', 'ᛁ', 'ᛃ', 'ᛈ', 'ᛉ', 'ᛋ', 'ᛏ', 'ᛒ', 'ᛖ', 'ᛗ', 'ᛚ', 'ᛜ', 'ᛞ', '✧', '✦', '☽', '☼', '☿', '♀', '♁', '♂'];
      ctx.fillStyle = c;
      ctx.font = 'bold 36px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const count = 32;
      for (let i = 0; i < count; i++) {
        const a = (Math.PI * 2 / count) * i;
        const rx = 512 + Math.cos(a) * 375;
        const ry = 512 + Math.sin(a) * 375;
        ctx.save();
        ctx.translate(rx, ry);
        ctx.rotate(a + Math.PI / 2);
        ctx.fillText(runes[i % runes.length], 0, 0);
        ctx.restore();
      }

      return new THREE.CanvasTexture(canvas);
    }

    // Procedural specular air bubble texture generator tailored per hero archetype
    function createBubbleTexture(accentHex, styleType) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 128, 128);

      const hexStr = '#' + accentHex.toString(16).padStart(6, '0');

      // 1. Translucent liquid sphere gradient
      const grad = ctx.createRadialGradient(54, 54, 12, 64, 64, 58);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.22)');
      grad.addColorStop(0.65, hexToRgba(hexStr, 0.14));
      grad.addColorStop(0.88, hexToRgba(hexStr, 0.50));
      grad.addColorStop(1.0, hexToRgba(hexStr, 0.85));

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(64, 64, 56, 0, Math.PI * 2);
      ctx.fill();

      // 2. Glossy iridescent rim membrane
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(64, 64, 56, 0, Math.PI * 2);
      ctx.stroke();

      // 3. Primary sharp specular reflection glint (top-left)
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(45, 38, 16, 8, -Math.PI / 4, 0, Math.PI * 2);
      const specGrad = ctx.createRadialGradient(45, 38, 1, 45, 38, 16);
      specGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
      specGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.65)');
      specGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = specGrad;
      ctx.fill();
      ctx.restore();

      // 4. Secondary soft bounce crescent reflection (bottom-right)
      ctx.save();
      ctx.beginPath();
      ctx.arc(64, 64, 51, Math.PI * 0.15, Math.PI * 0.48);
      ctx.strokeStyle = hexToRgba(hexStr, 0.85);
      ctx.lineWidth = 3.5;
      ctx.stroke();
      ctx.restore();

      // 5. Hero-specific internal energy nucleus
      if (styleType === 'electric_spark') {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(56, 54); ctx.lineTo(63, 62); ctx.lineTo(60, 65); ctx.lineTo(70, 74);
        ctx.stroke();
      } else if (styleType === 'biohazard_culture') {
        ctx.fillStyle = '#76ff03';
        ctx.beginPath();
        ctx.arc(61, 62, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.arc(71, 69, 4, 0, Math.PI * 2);
        ctx.fill();
      } else if (styleType === 'pathogen_spore') {
        ctx.fillStyle = 'rgba(206, 147, 216, 0.9)';
        ctx.beginPath();
        ctx.arc(64, 64, 8, 0, Math.PI * 2);
        ctx.fill();
      } else if (styleType === 'womb_aurora') {
        ctx.fillStyle = 'rgba(255, 192, 203, 0.9)';
        ctx.beginPath();
        ctx.arc(64, 64, 7, 0, Math.PI * 2);
        ctx.fill();
      } else if (styleType === 'marrow_cyan') {
        ctx.fillStyle = 'rgba(128, 222, 234, 0.85)';
        ctx.beginPath();
        ctx.arc(64, 64, 7, 0, Math.PI * 2);
        ctx.fill();
      }

      return new THREE.CanvasTexture(canvas);
    }

    class DotaStyleHeroShowcase {
      constructor(container) {
        this.container = container;
        this.clock = new THREE.Clock();
        this.characterSlot = new THREE.Group();
        this.environmentGroup = new THREE.Group();
        this.bubbleGroup = new THREE.Group();

        this.currentModelWrapper = null;
        this.baseScale = 1.0;
        this.isFullBodyModel = false;
        this.floatingGems = [];
        this.airBubbles = [];
        this.envAnimatedObjects = [];
        this.monumentAnimatedObjects = [];

        this.pedestalRuneMesh = null;
        this.pedestalInnerRuneMesh = null;
        this.auraParticles = null;
        this.sparksParticles = null;
        this.currentAccentColor = new THREE.Color(0x00e5ff);
        this.loadId = 0;

        // 1. Scene Setup with Atmospheric Fog (transparent background to reveal rich backdrop)
        this.scene = new THREE.Scene();
        this.scene.background = null;
        this.scene.fog = new THREE.FogExp2(0x02050f, 0.02);

        // Dedicated slots
        this.scene.add(this.environmentGroup);
        this.scene.add(this.characterSlot);
        this.scene.add(this.bubbleGroup);

        // 2. Compute safe dimensions
        const w = container.clientWidth || window.innerWidth || 400;
        const h = container.clientHeight || window.innerHeight || 600;

        // 3. Perspective Camera (Heroic 3/4 framing: targets chest at 0.92, distance 3.8)
        this.camera = new THREE.PerspectiveCamera(36, w / h, 0.1, 100);
        this.camera.position.set(0, 1.45, 3.8);

        // 4. Renderer with ACESFilmic Tone Mapping and alpha transparency
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        this.renderer.setClearColor(0x000000, 0);
        this.renderer.setSize(w, h);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.25;
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(this.renderer.domElement);

        // 5. OrbitControls with smooth inertia
        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.06;
        this.controls.enablePan = false;
        this.controls.maxPolarAngle = Math.PI / 2 - 0.04;
        this.controls.minPolarAngle = Math.PI / 4.2;
        this.controls.autoRotate = true;
        this.controls.autoRotateSpeed = 0.6;
        this.controls.minDistance = 2.2;
        this.controls.maxDistance = 5.2;
        this.controls.target.set(0, 0.92, 0);

        this.backSigilTexture = createSigilCanvasTexture();
        this.textureLoader = new THREE.TextureLoader();

        // 6. Build Baseline Subsystems
        this.initDotaStudioLighting();
        this.buildDotaPedestal();
        this.initMagicalSparks();

        window.addEventListener('resize', () => this.onResize());
        this.animate();
      }

        if (idx === 1002) return 'pulse';

      disposeHierarchy(rootGroup) {
        while (rootGroup.children.length > 0) {
          const obj = rootGroup.children[0];
          rootGroup.remove(obj);
          obj.traverse((child) => {
            if (child.isMesh || child.isSprite || child.isPoints) {
              if (child.geometry) child.geometry.dispose();
              if (child.material) {
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                mats.forEach(m => {
                  if (m.map) m.map.dispose();
                  if (m.normalMap) m.normalMap.dispose();
                  if (m.roughnessMap) m.roughnessMap.dispose();
                  if (m.metalnessMap) m.metalnessMap.dispose();
                  m.dispose();
                });
              }
            }
          });
        }
      }

      clearCharacterSlot() {
        if (this.mixer) {
          this.mixer.stopAllAction();
          this.mixer = null;
        }
        this.disposeHierarchy(this.characterSlot);
        this.disposeHierarchy(this.environmentGroup);
        this.disposeHierarchy(this.bubbleGroup);

        this.currentModelWrapper = null;
        this.baseScale = 1.0;
        this.isFullBodyModel = false;
        this.airBubbles = [];
        this.envAnimatedObjects = [];
        this.monumentAnimatedObjects = [];
      }

      initDotaStudioLighting() {
        // Ambient soft celestial fill
        this.ambient = new THREE.AmbientLight(0xffffff, 0.45);
        this.scene.add(this.ambient);

        // Key Light: High-angle warm golden spotlight
        this.keyLight = new THREE.DirectionalLight(0xfffaed, 2.5);
        this.keyLight.position.set(2.8, 5.5, 3.2);
        this.keyLight.castShadow = true;
        this.keyLight.shadow.mapSize.width = 1024;
        this.keyLight.shadow.mapSize.height = 1024;
        this.keyLight.shadow.bias = -0.001;
        this.scene.add(this.keyLight);

        // Fill Light: Low-intensity cool twilight from opposite side
        this.fillLight = new THREE.DirectionalLight(0x64748b, 0.95);
        this.fillLight.position.set(-3.2, 2.0, 2.5);
        this.scene.add(this.fillLight);

        // Back / Rim Light: Hero power archetype accent color
        this.rimLight = new THREE.DirectionalLight(this.currentAccentColor, 4.0);
        this.rimLight.position.set(0, 3.8, -3.8);
        this.scene.add(this.rimLight);

        // Pedestal Underglow: Upward beacon
        this.pedestalGlow = new THREE.PointLight(this.currentAccentColor, 3.0, 4.5);
        this.pedestalGlow.position.set(0, 0.35, 0);
        this.scene.add(this.pedestalGlow);

        // Front Soft Fill for the hero emblem
        this.frontGlow = new THREE.PointLight(0xffffff, 0.9, 3.5);
        this.frontGlow.position.set(0, 1.3, 1.8);
        this.scene.add(this.frontGlow);
      }

      applyHeroLightingProfile(profile) {
        if (!profile) return;
        this.keyLight.color.setHex(profile.keyColor);
        this.keyLight.intensity = profile.keyIntensity;

        this.fillLight.color.setHex(profile.fillColor);
        this.fillLight.intensity = profile.fillIntensity;

        this.rimLight.color.setHex(profile.rimColor);
        this.rimLight.intensity = profile.rimIntensity;

        this.pedestalGlow.color.setHex(profile.underglowColor);
        this.pedestalGlow.intensity = profile.underglowIntensity;

        // Transparent WebGL scene background allows dedicated hero backdrop to show through
        this.scene.background = null;
        if (this.scene.fog) {
          this.scene.fog.color.setHex(profile.fogColor);
          this.scene.fog.density = 0.018;
        }
      }

      initMagicalSparks() {
        const sparkCount = 70;
        const geom = new THREE.BufferGeometry();
        const positions = new Float32Array(sparkCount * 3);
        const scales = new Float32Array(sparkCount);

        for (let i = 0; i < sparkCount; i++) {
          const a = Math.random() * Math.PI * 2;
          const r = 0.35 + Math.random() * 1.1;
          positions[i * 3 + 0] = Math.cos(a) * r;
          positions[i * 3 + 1] = 0.15 + Math.random() * 2.8;
          positions[i * 3 + 2] = Math.sin(a) * r;
          scales[i] = 0.5 + Math.random() * 0.8;
        }

        geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geom.setAttribute('scale', new THREE.BufferAttribute(scales, 1));

        this.sparksMat = new THREE.PointsMaterial({
          color: this.currentAccentColor,
          size: 0.042,
          transparent: true,
          opacity: 0.75,
          blending: THREE.AdditiveBlending
        });
        this.sparksParticles = new THREE.Points(geom, this.sparksMat);
        this.scene.add(this.sparksParticles);
      }

      setHeroAccent(hexColor) {
        this.currentAccentColor.setHex(hexColor);
        this.rimLight.color.copy(this.currentAccentColor);
        this.pedestalGlow.color.copy(this.currentAccentColor);
        this.innerRingMat.color.copy(this.currentAccentColor);
        this.centerWellMat.color.copy(this.currentAccentColor);
        this.sparksMat.color.copy(this.currentAccentColor);

        // Regenerate rune texture with new color
        if (this.runeMat) {
          this.runeMat.map.dispose();
          this.runeMat.map = createRunicRingTexture(hexColor);
          this.runeMat.needsUpdate = true;
        }

        // Update floating gems
        this.floatingGems.forEach(gem => {
          if (gem.material) {
            gem.material.color.copy(this.currentAccentColor);
            gem.material.emissive.copy(this.currentAccentColor);
          }
        });

        // Update UI category dot
        const hexStr = '#' + hexColor.toString(16).padStart(6, '0');
        const dot = document.getElementById('category-dot');
        if (dot) {
          dot.style.background = hexStr;
          dot.style.boxShadow = `0 0 8px ${hexStr}`;
        }
        const sub = document.getElementById('hero-sub');
        if (sub) sub.style.color = hexStr;
      }

      buildHero3DEnvironment(config) {
        this.disposeHierarchy(this.environmentGroup);
        this.envAnimatedObjects = [];

        const key = this.getCharacterKey(config);

        if (key === 'axiom') {
          // ─── AXIOM (1001): Gothic Osteo-Cathedral ───
          for (let i = 0; i < 4; i++) {
            const archRadius = 1.35 + i * 0.38;
            const archGeo = new THREE.TorusGeometry(archRadius, 0.055, 12, 48, Math.PI);
            const archMat = new THREE.MeshStandardMaterial({
              color: 0x22303c,
              metalness: 0.85,
              roughness: 0.35,
              emissive: 0x00e5ff,
              emissiveIntensity: 0.15
            });
            const arch = new THREE.Mesh(archGeo, archMat);
            arch.rotation.x = Math.PI / 2;
            arch.rotation.z = Math.PI;
            arch.position.set(0, 0.3 + i * 0.35, -0.65 - i * 0.45);
            this.environmentGroup.add(arch);
            this.envAnimatedObjects.push({ obj: arch, type: 'arch_pulse', phase: i * 0.8 });
          }

          // Flanking Spinal Columns with glowing marrow glyphs (flanked wider so they never block front)
          [-1.75, 1.75].forEach((xSide) => {
            const spineGroup = new THREE.Group();
            spineGroup.position.set(xSide, 0.15, -0.85);
            for (let v = 0; v < 6; v++) {
              const discGeo = new THREE.CylinderGeometry(0.11, 0.15, 0.13, 16);
              const discMat = new THREE.MeshStandardMaterial({
                color: 0x1a2632,
                metalness: 0.9,
                roughness: 0.25,
                emissive: 0x00e5ff,
                emissiveIntensity: 0.25
              });
              const disc = new THREE.Mesh(discGeo, discMat);
              disc.position.y = v * 0.26;
              spineGroup.add(disc);
            }
            this.environmentGroup.add(spineGroup);
          });

        } else if (key === 'pulse') {
          // ─── PULSE (1002): Cardio Resonance Hologram Ring & High-Voltage Pylons ───
          const ecgRingGeo = new THREE.TorusGeometry(1.9, 0.038, 16, 64);
          const ecgRingMat = new THREE.MeshStandardMaterial({
            color: 0xffd700,
            emissive: 0xffd700,
            emissiveIntensity: 0.8,
            metalness: 0.95,
            roughness: 0.1
          });
          const ecgRing = new THREE.Mesh(ecgRingGeo, ecgRingMat);
          ecgRing.position.set(0, 1.25, -0.6);
          this.environmentGroup.add(ecgRing);
          this.envAnimatedObjects.push({ obj: ecgRing, type: 'spin_z', speed: 0.2 });

          [-1.3, 1.3].forEach((xPos, idx) => {
            const pylonGroup = new THREE.Group();
            pylonGroup.position.set(xPos, 0.15, -0.5);
            const mastGeo = new THREE.CylinderGeometry(0.08, 0.12, 1.8, 16);
            const mastMat = new THREE.MeshStandardMaterial({ color: 0x0a1628, metalness: 0.9, roughness: 0.2 });
            const mast = new THREE.Mesh(mastGeo, mastMat);
            mast.position.y = 0.9;
            pylonGroup.add(mast);

            for (let c = 0; c < 4; c++) {
              const coilGeo = new THREE.TorusGeometry(0.18, 0.025, 12, 24);
              const coilMat = new THREE.MeshStandardMaterial({
                color: 0x00ffff,
                emissive: 0x00ffff,
                emissiveIntensity: 0.9
              });
              const coil = new THREE.Mesh(coilGeo, coilMat);
              coil.rotation.x = Math.PI / 2;
              coil.position.y = 0.45 + c * 0.35;
              pylonGroup.add(coil);
            }
            this.environmentGroup.add(pylonGroup);
            this.envAnimatedObjects.push({ obj: pylonGroup, type: 'bob_pylon', phase: idx * Math.PI });
          });

        } else if (key === 'catalyst') {
          // ─── CATALYST (1003): Alchemical Celestial Orbit Rings (PERFECT CIRCLES - NO HEXAGONS!) ───
          for (let r = 0; r < 3; r++) {
            const ringGeo = new THREE.TorusGeometry(1.4 + r * 0.35, 0.032, 16, 64); // perfectly round torus, zero sharp hexagonal vertices
            const ringMat = new THREE.MeshStandardMaterial({
              color: 0xce93d8,
              emissive: 0x9c27b0,
              emissiveIntensity: 0.7,
              metalness: 0.9,
              roughness: 0.2
            });
            const bRing = new THREE.Mesh(ringGeo, ringMat);
            bRing.position.set(0, 1.25, -0.7);
            bRing.rotation.x = 0.35 * (r + 1);
            bRing.rotation.y = 0.25 * r;
            this.environmentGroup.add(bRing);
            this.envAnimatedObjects.push({ obj: bRing, type: 'spin_axes', speedX: 0.12 * (r + 1), speedY: -0.15 * (r + 1) });
          }

          // Floating Alchemical Essence Orbs
          for (let a = 0; a < 7; a++) {
            const aGeo = new THREE.SphereGeometry(0.085, 16, 16);
            const aMat = new THREE.MeshStandardMaterial({
              color: a % 2 === 0 ? 0xff4081 : 0x00e5ff,
              emissive: a % 2 === 0 ? 0xff4081 : 0x00e5ff,
              emissiveIntensity: 0.85
            });
            const atom = new THREE.Mesh(aGeo, aMat);
            atom.position.set(
              Math.cos(a * 0.9) * 1.35,
              0.85 + Math.sin(a * 1.3) * 0.65,
              -0.65 + Math.sin(a * 0.7) * 0.3
            );
            this.environmentGroup.add(atom);
          }

        } else if (key === 'necros') {
          // ─── NECROS (1004): Histopathology Ocular Halo & Floating Biopsy Discs ───
          const ocularGeo = new THREE.TorusGeometry(2.0, 0.08, 16, 64);
          const ocularMat = new THREE.MeshStandardMaterial({
            color: 0x2e0854,
            emissive: 0xba68c8,
            emissiveIntensity: 0.65,
            metalness: 0.95,
            roughness: 0.15
          });
          const ocular = new THREE.Mesh(ocularGeo, ocularMat);

      // =========================================================================
      // 2. LITTLE AIR BUBBLES SYSTEM (STRICTLY ONLY WHERE GLB IS PRESENT)
      // =========================================================================
      buildCharacterAirBubbles(config) {
        this.disposeHierarchy(this.bubbleGroup);
        this.airBubbles = [];

        // STRICT SAFETY CHECK: NEVER create bubbles for 2D image avatars
        if (!this.isFullBodyModel) return;

        const key = this.getCharacterKey(config);
        const profile = HERO_PROFILES[key] || HERO_PROFILES.axiom;

        const bubbleTex = createBubbleTexture(profile.bubbleColor, profile.bubbleStyle);
        const count = profile.bubbleCount || 45;

        for (let i = 0; i < count; i++) {
          const spriteMat = new THREE.SpriteMaterial({
            map: bubbleTex,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
          });
          const sprite = new THREE.Sprite(spriteMat);

          const angle = Math.random() * Math.PI * 2;
          const radius = 0.45 + Math.random() * 0.95;
          const y = 0.15 + Math.random() * 2.3;
          const scale = 0.055 + Math.random() * 0.085;

          sprite.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
          sprite.scale.set(scale, scale, scale);

          sprite.userData = {
            baseRadius: radius,
            angle: angle,
            riseSpeed: profile.bubbleSpeed * (0.8 + Math.random() * 0.5),
            wobbleSpeed: profile.bubbleWobble * (0.8 + Math.random() * 0.4),
            wobbleAmp: 0.02 + Math.random() * 0.035,
            phase: Math.random() * Math.PI * 2,
            baseScale: scale
          };

          this.bubbleGroup.add(sprite);
          this.airBubbles.push(sprite);
        }
      }

        this.textureLoader.load(imagePath, (avatarTex) => {
          if (currentLoadId !== this.loadId) return;

          // Clear previous character & ENSURE NO BUBBLES OR GLB BACKDROPS EXIST

          this.isFullBodyModel = false;

          const monumentRoot = new THREE.Group();

            const angle = (Math.PI * 2 / numSockets) * i;
            const gemGeo = new THREE.OctahedronGeometry(0.045);
            const gemMat = new THREE.MeshStandardMaterial({
              color: this.currentAccentColor,
              emissive: this.currentAccentColor,
              emissiveIntensity: 0.85,
              metalness: 0.9,
              roughness: 0.1
            });
            const gemMesh = new THREE.Mesh(gemGeo, gemMat);
            gemMesh.position.set(
              Math.cos(angle) * (radius + 0.035),
              Math.sin(angle) * (radius + 0.035),
              0
            );
            medallionGroup.add(gemMesh);
          }

          // D. Concentric 3D Gyroscopic Armillary Rings
          const ringConfigs = [
            { r: radius + 0.18, tube: 0.016, axis: 'x', speed: 0.45, color: 0xd4af37 },
            { r: radius + 0.32, tube: 0.014, axis: 'y', speed: -0.35, color: this.currentAccentColor },
            { r: radius + 0.46, tube: 0.012, axis: 'z', speed: 0.25, color: 0xf59e0b }
          ];
          ringConfigs.forEach(rc => {
            const rGeo = new THREE.TorusGeometry(rc.r, rc.tube, 12, 64);
            const rMat = new THREE.MeshStandardMaterial({
              color: rc.color,
              emissive: rc.color,
              emissiveIntensity: 0.5,
              metalness: 0.95,
              roughness: 0.15
            });
            const ringMesh = new THREE.Mesh(rGeo, rMat);
            medallionGroup.add(ringMesh);
            this.monumentAnimatedObjects.push({ obj: ringMesh, type: 'gyro_ring', axis: rc.axis, speed: rc.speed });
          });

          monumentRoot.add(medallionGroup);
          this.characterSlot.add(monumentRoot);

          this.currentModelWrapper = medallionGroup;
          this.baseScale = 1.0;

          // Orbiting mana gems
          this.buildOrbitingCrystals();
          this.buildAuraMist();
        });
      }

      loadGuardian(config) {
        this.loadId++;
        const currentLoadId = this.loadId;

        // Synchronously wipe character slot immediately so old hero vanishes on click
        this.clearCharacterSlot();

        // Clear previous aura & floating gems
        if (this.auraParticles) {
          this.scene.remove(this.auraParticles);
          if (this.auraParticles.geometry) this.auraParticles.geometry.dispose();
          if (this.auraParticles.material) this.auraParticles.material.dispose();
          this.auraParticles = null;
        }
        this.floatingGems.forEach(g => {
          this.scene.remove(g);
          if (g.geometry) g.geometry.dispose();
          if (g.material) g.material.dispose();
        });
        this.floatingGems = [];

        // Update UI Badge
        const heroNameEl = document.getElementById('hero-name');
        if (heroNameEl) heroNameEl.innerText = config.name || 'Curia Guardian';
        const heroSubEl = document.getElementById('hero-sub-text');
        if (heroSubEl) heroSubEl.innerText = (config.animal || 'Guardian') + ' • ' + (config.powerCategory || 'ELITE');

        // Determine theme color
        const rimColor = (config.renderConfig && config.renderConfig.rimColorHex) ? config.renderConfig.rimColorHex : 0x00e5ff;
        this.setHeroAccent(rimColor);

        // Update dedicated thematic background image
        const charKey = this.getCharacterKey(config);
        this.updateHeroBackground(config, charKey);

        // Activate Hero-Specific Thematic Loading Screen
        const loadOverlay = document.getElementById('hero-loading-screen');
        const loadSubject = document.getElementById('loading-subject');
        const loadTitle = document.getElementById('loading-title');
        const loadMnemonic = document.getElementById('loading-mnemonic');
        const loadSpinner = document.getElementById('loading-spinner');

        if (loadOverlay) {
          if (loadSubject) loadSubject.innerText = config.subject || (config.animal ? ('THE ' + config.animal.toUpperCase()) : 'CLINICAL HERO');
          if (loadTitle) loadTitle.innerText = config.name || 'Hero Champion';
          if (loadMnemonic) loadMnemonic.innerText = config.mnemonic ? ('💡 ' + config.mnemonic) : 'Mastering clinical medicine, one question at a time.';
          if (loadSpinner && config.renderConfig && config.renderConfig.rimColorHex) {
            const hex = '#' + config.renderConfig.rimColorHex.toString(16).padStart(6, '0');
            loadSpinner.style.borderTopColor = hex;
            loadSpinner.style.boxShadow = '0 0 16px ' + hex;
            if (loadSubject) loadSubject.style.color = hex;
          }
          loadOverlay.classList.add('active');
        }

        // Frame camera target to hero chest level
        if (this.controls) {
          this.controls.target.set(0, 0.92, 0);
          this.controls.update();
        }

        // Check for 3D full-body GLTF model (.glb)
        if (config.renderConfig && config.renderConfig.modelGlbUrl) {
          const gltfLoader = new THREE.GLTFLoader();
          gltfLoader.load(config.renderConfig.modelGlbUrl, (gltf) => {
            // Drop outdated async loads if user switched characters quickly
            if (currentLoadId !== this.loadId) return;

            // Clear again right before attaching
            this.clearCharacterSlot();

            this.isFullBodyModel = true;

            // Apply customized 5-point studio lighting for this hero
            const key = this.getCharacterKey(config);
            const profile = HERO_PROFILES[key] || HERO_PROFILES.axiom;
            this.applyHeroLightingProfile(profile);

            const rawModel = gltf.scene;

            // Strip any skeletal rigs and convert SkinnedMeshes to pure static THREE.Mesh
            // Character showcase presents pristine rest-pose 3D sculpts with zero rigging/animation
            const skinnedMeshes = [];
            rawModel.traverse((child) => {
              if (child.isSkinnedMesh) {
                skinnedMeshes.push(child);
              }
            });

            skinnedMeshes.forEach((skinned) => {
              const staticGeo = skinned.geometry.clone();
              if (staticGeo.attributes.skinIndex) staticGeo.deleteAttribute('skinIndex');
              if (staticGeo.attributes.skinWeight) staticGeo.deleteAttribute('skinWeight');

              let staticMat = skinned.material;
              if (Array.isArray(staticMat)) {
                staticMat = staticMat.map(m => {
                  const cm = m.clone();
                  cm.needsUpdate = true;
                  return cm;
                });
              } else if (staticMat) {
                staticMat = staticMat.clone();
                staticMat.needsUpdate = true;
              }

              const staticMesh = new THREE.Mesh(staticGeo, staticMat);
              staticMesh.name = skinned.name;
              staticMesh.position.copy(skinned.position);
              staticMesh.quaternion.copy(skinned.quaternion);
              staticMesh.scale.copy(skinned.scale);
              staticMesh.castShadow = true;
              staticMesh.receiveShadow = true;

              if (skinned.parent) {
                skinned.parent.add(staticMesh);
                skinned.parent.remove(skinned);
              }
            });

            // Remove all Bone nodes from the scene hierarchy
            const bonesToRemove = [];
            rawModel.traverse((child) => {
              if (child.isBone || child.type === 'Bone') {
                bonesToRemove.push(child);
              }
            });
            bonesToRemove.forEach((bone) => {
              if (bone.parent) {
                bone.parent.remove(bone);
              }
            });

            // Compute precise unscaled bounding box
            const box = new THREE.Box3().setFromObject(rawModel);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            // Target normalized heroic height = 1.60 meters across all champions
            const targetHeight = 1.60;
            const scale = (size.y > 0.05) ? (targetHeight / size.y) : 1.0;

            // Center horizontally and put bottom (soles of feet) at local y=0
            rawModel.position.set(-center.x, -box.min.y, -center.z);

            const wrapper = new THREE.Group();
            wrapper.add(rawModel);

            // Scale wrapper to normalized heroic size
            wrapper.scale.set(scale, scale, scale);
            // Place soles firmly grounded on top surface of the dais (y = 0.125)
            wrapper.position.set(0, 0.125, 0);

            // Preserve and optimize PBR maps
            rawModel.traverse((child) => {
              if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
                const mat = child.material;
                if (mat && (mat.map || (Array.isArray(mat) && mat.some(m => m.map)))) {
                  const mats = Array.isArray(mat) ? mat : [mat];
                  mats.forEach(m => {
                    m.roughness = m.roughness !== undefined ? Math.min(m.roughness, 0.55) : 0.45;
                    m.metalness = m.metalness !== undefined ? m.metalness : 0.2;
                    m.needsUpdate = true;
                  });
                } else {
                  child.material = new THREE.MeshStandardMaterial({
                    vertexColors: true,
                    metalness: 0.62,
                    roughness: 0.38,
                    emissive: this.currentAccentColor,
                    emissiveIntensity: 0.08
                  });
                }
              }
            });

            this.characterSlot.add(wrapper);
            this.currentModelWrapper = wrapper;
            this.baseScale = scale;

            // Character showcase: Zero rig and zero animation (pure static rest pose sculpt)
            this.mixer = null;

            // Build dedicated 3D environment matching GLB
            this.buildHero3DEnvironment(config);

            // Build little air bubbles (STRICTLY ONLY WHERE GLB IS PRESENT)
            this.buildCharacterAirBubbles(config);

            this.buildOrbitingCrystals();
            this.buildAuraMist();

            // Dismiss loading overlay smoothly
            if (loadOverlay) {
              setTimeout(() => { loadOverlay.classList.remove('active'); }, 180);
            }
          }, undefined, (err) => {
            if (currentLoadId !== this.loadId) return;
            console.warn("GLTF load failed, falling back to 3D medallion:", err);
            if (loadOverlay) loadOverlay.classList.remove('active');
            this.loadMedallion(config, currentLoadId);
          });
        } else {
          if (loadOverlay) loadOverlay.classList.remove('active');
          this.loadMedallion(config, currentLoadId);
        }
      }

      buildOrbitingCrystals() {
        const gemCount = 4;
        for (let i = 0; i < gemCount; i++) {
          const geo = new THREE.DodecahedronGeometry(0.065);
          const mat = new THREE.MeshStandardMaterial({
            color: this.currentAccentColor,
            emissive: this.currentAccentColor,
            emissiveIntensity: 0.75,
            metalness: 0.95,
            roughness: 0.12
          });
          const gem = new THREE.Mesh(geo, mat);
          gem.castShadow = true;

          const baseAngle = (Math.PI * 2 / gemCount) * i;
          gem.userData = {
            angle: baseAngle,
            speed: 0.75 + (i % 2 === 0 ? 0.2 : -0.15),
            radiusX: 1.38 + (i * 0.06),
            radiusZ: 1.15 + (i * 0.04),
            yCenter: 1.35,
            tilt: 0.28 * (i % 2 === 0 ? 1 : -1)
          };
          this.scene.add(gem);
          this.floatingGems.push(gem);
        }
      }

      buildAuraMist() {
        const count = 36;
        const geom = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);

        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const r = 0.6 + Math.random() * 0.65;
          positions[i * 3 + 0] = Math.cos(a) * r;
          positions[i * 3 + 1] = 0.7 + Math.random() * 1.3;
          positions[i * 3 + 2] = (Math.random() - 0.5) * 0.4;
        }

        geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const mat = new THREE.PointsMaterial({
          color: this.currentAccentColor,
          size: 0.055,
          transparent: true,
          opacity: 0.7,
          blending: THREE.AdditiveBlending
        });
        this.auraParticles = new THREE.Points(geom, mat);
        this.scene.add(this.auraParticles);
      }

      onResize() {
        this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
      }

      animate = () => {
        requestAnimationFrame(this.animate);
        const delta = this.clock.getDelta();
        const time = this.clock.getElapsedTime();

        // Update character skeletal animation mixer if playing
        if (this.mixer) {
          this.mixer.update(delta);
        }

        // 1. Hero / Medallion Breathing & Bobbing
        if (this.currentModelWrapper) {
          if (this.isFullBodyModel) {
            // Static pure decimated GLB model firmly grounded
            if (this.baseScale) {
              this.currentModelWrapper.scale.set(this.baseScale, this.baseScale, this.baseScale);
            }
          } else {
            this.currentModelWrapper.position.y = 1.35 + Math.sin(time * 1.6) * 0.045;
            this.currentModelWrapper.rotation.z = Math.sin(time * 0.8) * 0.02;
          }
        }

        // 2. 3D Holographic Monument Animations (Strictly for 2D image avatars)
        if (!this.isFullBodyModel && this.monumentAnimatedObjects.length > 0) {
          this.monumentAnimatedObjects.forEach(item => {
            if (item.type === 'spin_y') {
              item.obj.rotation.y += item.speed * delta;
            } else if (item.type === 'breathe_beam') {
              item.obj.material.opacity = 0.12 + Math.sin(time * 2.2) * 0.05;
            } else if (item.type === 'gyro_ring') {
              if (item.axis === 'x') item.obj.rotation.x += item.speed * delta;
              else if (item.axis === 'y') item.obj.rotation.y += item.speed * delta;
              else if (item.axis === 'z') item.obj.rotation.z += item.speed * delta;
            }
          });
        }

        // 3. Unique 3D Environment Animations (Strictly for GLB characters)
        if (this.isFullBodyModel && this.envAnimatedObjects.length > 0) {
          this.envAnimatedObjects.forEach(item => {
            if (item.type === 'spin_z') {
              item.obj.rotation.z += item.speed * delta;
            } else if (item.type === 'spin_y') {
              item.obj.rotation.y += item.speed * delta;
            } else if (item.type === 'spin_axes') {
              item.obj.rotation.x += (item.speedX || 0) * delta;
              item.obj.rotation.y += (item.speedY || 0) * delta;
            } else if (item.type === 'arch_pulse') {
              item.obj.material.emissiveIntensity = 0.15 + Math.sin(time * 2.5 + item.phase) * 0.12;
            } else if (item.type === 'bob_pylon') {
              item.obj.position.y = 0.15 + Math.sin(time * 2.0 + item.phase) * 0.04;
            } else if (item.type === 'wobble_slide') {
              item.obj.rotation.z = Math.sin(time * 1.5 + item.phase) * 0.1;
            } else if (item.type === 'tumble_capsule') {
              item.obj.rotation.x += item.speed * delta;
              item.obj.rotation.y += item.speed * 0.7 * delta;
            } else if (item.type === 'pulse_cross') {
              item.obj.children.forEach(c => {
                c.material.opacity = 0.45 + Math.sin(time * 2.0) * 0.2;
              });
            } else if (item.type === 'spin_crown') {
              item.obj.rotation.y += item.speed * delta;
            } else if (item.type === 'pulse_cone') {
              item.obj.material.opacity = 0.12 + Math.sin(time * 2.8) * 0.06;
            } else if (item.type === 'orbit_sat') {
              const a = time * item.speed;
              item.obj.position.x = Math.cos(a) * item.radius;
              item.obj.position.z = -0.85 + Math.sin(a) * item.radius;
              item.obj.position.y = 1.35 + Math.sin(a) * item.tilt;
            } else if (item.type === 'pulse_caduceus') {
              item.obj.position.y = 0.4 + Math.sin(time * 1.8) * 0.035;
            } else if (item.type === 'pulse_laser') {
              item.obj.material.opacity = 0.18 + Math.sin(time * 3.0) * 0.1;
            } else if (item.type === 'breathe_wings') {
              item.obj.rotation.y = Math.sin(time * 1.2) * 0.08;
            } else if (item.type === 'bob_star') {
              item.obj.position.y += Math.sin(time * 2.2 + item.phase) * 0.001;
            }
          });
        }

        // 4. Little Air Bubbles Physics (STRICTLY ONLY ACTIVE WHERE GLB IS PRESENT)
        if (this.isFullBodyModel && this.airBubbles.length > 0) {
          this.airBubbles.forEach(bubble => {
            const ud = bubble.userData;
            bubble.position.y += ud.riseSpeed;

            // Gentle sinusoidal buoyancy wobble
            const currentAngle = ud.angle + Math.sin(time * ud.wobbleSpeed + ud.phase) * 0.15;
            const currentRadius = ud.baseRadius + Math.sin(time * ud.wobbleSpeed * 0.8 + ud.phase) * ud.wobbleAmp;
            bubble.position.x = Math.cos(currentAngle) * currentRadius;
            bubble.position.z = Math.sin(currentAngle) * currentRadius;

            // Elastic bubble scale breathing
            const sPulse = ud.baseScale * (1.0 + Math.sin(time * 3.5 + ud.phase) * 0.12);
            bubble.scale.set(sPulse, sPulse, sPulse);

            // Pop and reset at ceiling
            if (bubble.position.y > 2.5) {
              bubble.position.y = 0.18 + Math.random() * 0.15;
              ud.angle = Math.random() * Math.PI * 2;
              ud.baseRadius = 0.45 + Math.random() * 0.95;
            }
          });
        }

        // 5. Counter-Rotating Pedestal Runic Rings
        if (this.pedestalRuneMesh) {
          this.pedestalRuneMesh.rotation.z += 0.0025;
          const pulse = 0.7 + Math.sin(time * 2.2) * 0.25;
          this.runeMat.opacity = pulse;
        }
        if (this.pedestalInnerRuneMesh) {
          this.pedestalInnerRuneMesh.rotation.z -= 0.004;
        }

        // 6. Floating Elemental Crystals Orbiting in 3D Ellipses
        this.floatingGems.forEach(gem => {
          const d = gem.userData;
          d.angle += d.speed * delta;
          gem.position.x = Math.cos(d.angle) * d.radiusX;
          gem.position.z = Math.sin(d.angle) * d.radiusZ;
          gem.position.y = d.yCenter + Math.sin(d.angle) * d.tilt + Math.sin(time * 2.5 + d.angle) * 0.05;
          gem.rotation.y += 0.05;
          gem.rotation.x += 0.03;
        });

        // 7. Ground Sparks Rising
        if (this.sparksParticles) {
          const pos = this.sparksParticles.geometry.attributes.position.array;
          for (let i = 0; i < pos.length; i += 3) {
            pos[i + 1] += 0.0035;
            if (pos[i + 1] > 3.0) pos[i + 1] = 0.15;
          }
          this.sparksParticles.geometry.attributes.position.needsUpdate = true;
        }

        // 8. Aura Mist Shimmer
        if (this.auraParticles) {
          const apos = this.auraParticles.geometry.attributes.position.array;
          for (let i = 0; i < apos.length; i += 3) {
            apos[i + 1] += 0.002;
            if (apos[i + 1] > 2.2) apos[i + 1] = 0.7;
          }
          this.auraParticles.geometry.attributes.position.needsUpdate = true;
          this.auraParticles.material.opacity = 0.5 + Math.sin(time * 2.8) * 0.2;
        }

        // Self-healing resize check
        const curW = this.container.clientWidth || window.innerWidth;
        const curH = this.container.clientHeight || window.innerHeight;
        if (curW > 0 && curH > 0) {
          const domW = this.renderer.domElement.clientWidth;
          const domH = this.renderer.domElement.clientHeight;
          if (Math.abs(domW - curW) > 4 || Math.abs(domH - curH) > 4) {
            this.onResize();
          }
        }

        this.controls.update();
        this.renderer.render(this.scene, this.camera);
      };
    }

    let showcase = null;
    let pendingGuardianConfig = null;

    function initShowcase() {
      if (showcase) return;
      const container = document.getElementById('canvas-container');
      if (!container) return;
      console.log('initShowcase running, container size:', container.clientWidth, container.clientHeight);
      showcase = new DotaStyleHeroShowcase(container);

      if (pendingGuardianConfig) {
        console.log('Applying pendingGuardianConfig:', pendingGuardianConfig);
        showcase.loadGuardian(pendingGuardianConfig);
        pendingGuardianConfig = null;
      }
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      setTimeout(initShowcase, 1);
    } else {
      window.addEventListener('DOMContentLoaded', initShowcase);
      window.addEventListener('load', initShowcase);
    }

    // Called from Android with guardian JSON config
    window.loadGuardian = function(jsonString) {
      try {
        console.log('window.loadGuardian received payload');
        const config = typeof jsonString === 'string' ? JSON.parse(jsonString) : jsonString;
        if (showcase) {
          showcase.loadGuardian(config);
        } else {
          console.log('showcase not yet initialized, caching config');
          pendingGuardianConfig = config;
        }
      } catch (e) {
        console.error('Error loading guardian in showcase:', e);
      }
    };

    window.toggleTurntable = function(enabled) {
      if (showcase && showcase.controls) {
        showcase.controls.autoRotate = !!enabled;
      }
    };
  </script>
</body>
</html>
